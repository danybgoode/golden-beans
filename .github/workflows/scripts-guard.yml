# DevOps reliability cleanup — Sprint 2 follow-up.
# Deterministic gate for the CLI/tooling node:tests under scripts/ — the cross-agent
# reviewer rail (scripts/lib/cross-agent-cli.mjs) and the roadmap→notion generators
# (scripts/roadmap-to-notion.mjs). These had no CI runner; only infra/ did (infra-guard.yml),
# so a regression in the agy/codex driver or the build-order/notion logic was caught only by
# a manual `node --test`. Both test files import node built-ins ONLY (zero npm deps), so this
# needs no install step — same shape as infra-guard.yml.
name: scripts-guard

on:
  push:
    branches: [main]
    paths:
      - 'skills/template/scripts/**'
      - 'scripts/**'
      - '.claude/**'
      - '.github/workflows/scripts-guard.yml'
      - 'jev.config.json'
  pull_request:
    paths:
      - 'skills/template/scripts/**'
      - 'scripts/**'
      - '.claude/**'
      - '.github/workflows/scripts-guard.yml'
      - 'jev.config.json'

jobs:
  cli-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run CLI/tooling node:test
        run: node --test 'scripts/lib/*.test.mjs' 'scripts/*.test.mjs'
      # The committed permission rules: every deny/ask rule cited in .claude/permissions-ledger.json,
      # verb-class allow list, no project-level auto mode. Static only — the --live replay spends real
      # sessions, so it is run by hand when rules change.
      # Jev semantic guards (dobby-foundation jev-semantic-guards D8): replay the labelled fixtures' RECORDED
      # Jev answers through the real judges (offline — never calls the API, needs no secret), and fail when a
      # rail has sat in `shadow` past its `shadowExpires`.
      - name: jev — eval replay + shadow expiry
        run: node scripts/jev-eval.mjs
      - name: permissions contract
        run: node scripts/permissions-smoke.mjs
      # scripts/ ∩ skills/template/scripts/ stay byte-identical, or are listed with a reason
      # (distribute-what-we-use D6). A drift here is how the review rail became three implementations.
      - name: script parity with the template
        run: node scripts/check-script-parity.mjs
