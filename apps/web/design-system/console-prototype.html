function setStateFilter(v){ APP.stateFilter = v==="all"?null:v; render(); }
function clearFilters(){ APP.q=""; APP.type="all"; APP.risk="all"; APP.stateFilter=null; render(); }
function restoreSearch(){
  const el=$("#searchbox"); if(el){ el.focus(); el.setSelectionRange(el.value.length,el.value.length); }
}

/* ═══ row menu ═══ */
function openMenu(ev,key){
  ev.stopPropagation(); closeMenu();
  const st = stateOf(key);
  const d = document.createElement("div");
  d.className="menu"; d.id="rowmenu";
  d.innerHTML = `
    <button onclick="closeMenu();openFeature('${key}')">Open feature</button>
    <button onclick="closeMenu();openFeature('${key}','environments')">Where is it on?</button>
    <button onclick="closeMenu();openFeature('${key}','history')">See its history</button>
    <hr>
    <button onclick="closeMenu();copyKey('${key}')">Copy name</button>
    <hr>
    <button class="${st.s==="on"?"danger":""}" onclick="closeMenu();requestToggle('${key}')">
      ${st.s==="on"?"Turn off in "+APP.env:"Turn on in "+APP.env}</button>`;
  document.body.appendChild(d);
  const r = ev.currentTarget.getBoundingClientRect();
  d.style.top = Math.min(r.bottom+6, innerHeight-230)+"px";
  d.style.left = Math.max(12, r.right-214)+"px";
}
function closeMenu(){ const m=$("#rowmenu"); if(m) m.remove(); }
function copyKey(k){ navigator.clipboard?.writeText(k); toast(`Copied ${k}`); }

/* ═══ toggling — never silent, never a typed reason ═══ */
function requestToggle(key){
  const f = FEATURES.find(x=>x.key===key), st = stateOf(key);
  if(st.s==="on"){ openConfirm(f); return; }
  openConfirm(f, true);
}
function applyChange(key, turnOn, reason){
  const f = FEATURES.find(x=>x.key===key);
  if(turnOn){
    STATE[APP.env][key] = {s:"on", v:f.versions, who:"Daniel", when:nowStamp(), reason};
  } else {
    STATE[APP.env][key] = {s:"off", v:null, who:"Daniel", when:nowStamp(), reason};
  }
  closeOverlay();
  toast(`${f.key} is ${turnOn?"on":"off"} in ${APP.env}`, key);
  render();
}
let UNDO = null;
function undoChange(key){
  if(UNDO && UNDO.key===key){ if(UNDO.prev) STATE[APP.env][key]=UNDO.prev; else delete STATE[APP.env][key]; }
  UNDO=null; toast("Change undone"); render();
}
function nowStamp(){
  const d=new Date();
  const p=n=>String(n).padStart(2,"0");
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}

/* ═══ overlays ═══ */
function closeOverlay(){ APP.overlay=null; APP.wizard=null; APP.editingDesc=false; renderOverlay(); }
document.addEventListener("keydown",e=>{ if(e.key==="Escape"){ closeOverlay(); closeMenu(); } });

function openFeature(key, tab){ APP.overlay={kind:"feature",key}; APP.modalTab=tab||"value"; renderOverlay(); }
function openConfirm(f, turningOn){
  UNDO = {key:f.key, prev: STATE[APP.env][f.key] ? {...STATE[APP.env][f.key]} : null};
  APP.overlay={kind:"confirm", key:f.key, turningOn:!!turningOn, reason:null};
  renderOverlay();
}
function openWizard(){ APP.wizard={step:1, ns:"catalog", name:"", type:null, risk:null, envs:["development"]};
  APP.overlay={kind:"wizard"}; renderOverlay(); }
function openDiff(){ APP.overlay={kind:"diff"}; renderOverlay(); }

function renderOverlay(){
  const o = APP.overlay, host = $("#overlays");
  if(!o){ host.innerHTML=""; return; }
  const inner = o.kind==="feature" ? featureModal(o) :
                o.kind==="confirm" ? confirmModal(o) :
                o.kind==="wizard"  ? wizardModal() :
                o.kind==="palette" ? paletteModal(o) : diffModal();
  host.innerHTML = `<div class="scrim" onclick="if(event.target===this)closeOverlay()">${inner}</div>`;
}

/* ── the feature modal: depth, not height ── */
/* Funnel and Impact are here, not in the nav. They were never destinations — each is
   one view of one feature, which is exactly why the old nav could not link to them
   without telling you to edit the URL. */
const MODAL_TABS = [
  ["value","Value"],["targeting","Targeting"],["environments","Environments"],
  ["funnel","Funnel"],["impact","Impact"],["history","History"],["settings","Settings"],
];
function featureModal(o){
  const f = FEATURES.find(x=>x.key===o.key), st = stateOf(f.key), env = ENVS.find(x=>x.id===APP.env);
  const panes = {
    value: valuePane(f,st,env), targeting: targetingPane(f,env), environments: envPane(f),
    funnel: funnelPane(f,st,env), impact: impactPane(f,st), history: historyPane(f),
    settings: settingsPane(f),
  };
  const foot = o2foot(o, f, st);
  return `<div class="modal" onclick="event.stopPropagation()">
    <div class="modal-head">
      <div>
        <h2><span class="k">${f.key}</span>
          <span class="tag ${f.type==="kill"?"kill":""} ${f.type==="unclassified"?"unclassified":""}">${TYPE_WORDS[f.type]}</span></h2>
        <div class="sub">${esc(f.desc)}</div>
      </div>
      <button class="x" onclick="closeOverlay()" aria-label="Close">✕</button>
    </div>
    <div class="modal-tabs" role="tablist">
      ${MODAL_TABS.map(([id,l])=>`<button class="modal-tab" role="tab" aria-selected="${APP.modalTab===id}"
        onclick="APP.modalTab='${id}';renderOverlay()">${l}</button>`).join("")}
    </div>
    <div class="modal-body">${panes[APP.modalTab]}</div>
    ${foot}
  </div>`;
}
function o2foot(o,f,st){
  if(["history","funnel","impact","environments"].includes(APP.modalTab))
    return `<div class="modal-foot"><span class="note">Nothing on this tab changes anything.</span>
      <button class="btn btn-ghost" onclick="closeOverlay()">Close</button></div>`;
  return `<div class="modal-foot">
    <span class="note">Changes apply to <b>${ENVS.find(x=>x.id===APP.env).name}</b> only.</span>
    <button class="btn btn-ghost" onclick="toast('Scheduling is a picker, not a text field — same three clicks')">Schedule for later</button>
    <button class="btn btn-primary" onclick="closeOverlay();toast('Saved to ${esc(f.key)}')">Save change</button>
  </div>`;
}

function valuePane(f,st,env){
  const isOn = st.s==="on";
  const vers = Array.from({length:f.versions},(_,i)=>f.versions-i);
  return `
  <div class="field">
    <span class="lab">Is it on in ${env.name}?</span>
    <div class="seg" role="group">
      <button class="yes" aria-pressed="${isOn}" onclick="requestToggle('${f.key}')">On</button>
      <button class="no" aria-pressed="${st.s==="off"}" onclick="requestToggle('${f.key}')">Off</button>
    </div>
    <p class="hint">${isOn
      ? `Everyone in ${env.name} gets this. Turning it off is one click and is recorded with a reason.`
      : st.s==="off"
        ? `Switched off by ${st.who} on ${st.when}. Reason given: ${st.reason}.`
        : `Nobody has ever switched this on or off in ${env.name}. Turning it on is the first thing that will happen to it here.`}</p>
  </div>
  <div class="field">
    <span class="lab">Which version is served</span>
    <div class="picklist">
      ${vers.map(v=>`<button class="pick" aria-pressed="${(st.v||f.versions)===v}"
        onclick="toast('${f.key} would serve v${v}')">
        <span class="radio"></span>
        <span><span class="t">Version <span class="mono">${v}</span></span>
        <span class="d">${v===f.versions?"Newest — created by the catalog sync":"Kept so you can go back to it"}</span></span>
        ${v===f.versions?'<span class="badge">Newest</span>':""}
      </button>`).join("")}
    </div>
    <p class="hint">Versions are made by the code that owns this feature. You pick one; you never write one.</p>
  </div>
  <div class="callout info">
    <span class="ico">◆</span>
    <span>This feature is a plain on/off switch, like all ${FEATURES.length} of them. If the code ever gives it
    something to choose between, the choices appear here as buttons — never as a box to type in.</span>
  </div>`;
}

function targetingPane(f,env){
  return `
  <div class="field">
    <span class="lab">Who gets it in ${env.name}</span>
    <div class="callout info"><span class="ico">◆</span>
      <span><b>Everyone.</b> This feature has no targeting rules, and neither do the other ${FEATURES.length-1}.
      Adding one below narrows it from everyone to a group.</span></div>
  </div>
  <div class="field">
    <span class="lab">Rules</span>
    <div class="rule">
      <span class="sel"><select><option>Seller plan</option><option>Country</option><option>Signed up</option>
        <option>Shop type</option><option>Account age</option></select></span>
      <span class="as">is</span>
      <span class="sel"><select><option>one of</option><option>not one of</option></select></span>
      <span class="sel"><select><option>Founding merchant</option><option>Pro</option><option>Free</option></select></span>
      <button class="rm" onclick="toast('Rule removed')" aria-label="Remove rule">✕</button>
    </div>
    <button class="btn btn-ghost btn-sm" onclick="toast('Another row of pickers appears — still nothing to type')">+ Add rule</button>
    <p class="hint">Every part of a rule is a list you choose from. There is no expression to write and nothing to get syntactically wrong.</p>
  </div>
  <div class="field">
    <span class="lab">Then give it to</span>
    <div class="slider">
      <input type="range" min="0" max="100" step="5" value="100"
        oninput="this.nextElementSibling.textContent=this.value+'%'">
      <span class="v">100%</span>
    </div>
    <p class="hint">Of the people who match the rules above. Drag to roll it out gradually.</p>
  </div>`;
}

function envPane(f){
  return `
  <p style="color:var(--dim);font-size:13.5px;margin-bottom:16px;max-width:64ch">
    The one screen that answers “is this on, where, and who did it”.
  </p>
  <table class="envtable">
    <thead><tr><th>Environment</th><th>State</th><th>Last touched by</th><th></th></tr></thead>
    <tbody>${ENVS.map(e=>{
      const st = stateOf(f.key, e.id), w = STATE_WORDS[st.s];
      return `<tr>
        <td><span class="envname"><span class="env-dot ${e.id}"></span>${e.name}
          ${e.id===APP.env?'<span class="here">you are here</span>':""}</span></td>
        <td><span class="pill ${st.s}"><span class="dot"></span>${w.label}</span>
          <div class="who">${st.s==="on"?`serving v${st.v}`:st.s==="off"?"serving nothing":"no record at all"}</div></td>

  <div class="callout info" style="margin-top:18px"><span class="ico">◆</span>

}

/* Was /app/funnel/[projectSlug]/[featureKey] — the page whose nav entry read
   "swap the feature key in the URL". Here the key comes from the feature you opened. */
function funnelPane(f,st,env){
  if(st.s!=="on"){
    return `<div class="empty"><b>Nothing to measure yet in ${env.name}</b>
      <span>The funnel starts filling the moment this is switched on here.</span></div>`;
  }
  const data = [820,910,760,1180,1340,990,1420,1610,1550,1290,1730,1880,1810,2040];
  const max = Math.max(...data);
  const tars = [["Targeted",24330,100],["Adopted",9420,39],["Retained",5180,21]];
  return `
  <div class="kpis">
    ${tars.map(([k,n,p])=>`<div class="kpi"><div class="n">${n.toLocaleString()}</div>
      <div class="k">${k} · ${p}%</div></div>`).join("")}
  </div>
  <div class="field">
    <span class="lab">Targeted → adopted → retained</span>
    ${tars.map(([k,n,p])=>`<div style="margin-bottom:9px">
      <div style="display:flex;justify-content:space-between;font-size:12.5px;color:var(--dim);margin-bottom:4px">
        <span>${k}</span><span class="mono">${n.toLocaleString()}</span></div>
      <div style="height:9px;border-radius:5px;background:var(--roast-2);overflow:hidden">
        <div style="height:100%;width:${p}%;background:linear-gradient(90deg,var(--gold),var(--gold-deep))"></div></div>

    <p class="hint">Reaching this used to mean typing the feature key into the address bar. It is a

  <div class="field">
    <span class="lab">Times served, last 14 days</span>

    <div class="barscale"><span>14 Aug</span><span>27 Aug</span></div>
    <p class="hint">If this drops to zero without anybody turning it off, something upstream stopped asking.</p>
  </div>`;
}

/* Was /app/impact/[projectSlug]/[featureKey] — same story. */
function impactPane(f,st){
  if(st.s!=="on"){
    return `<div class="empty"><b>No impact to attribute</b>
      <span>This has never run in front of anyone, so it has moved nothing.</span></div>`;
  }
  return `
  <div class="kpis">
    <div class="kpi"><div class="n" style="color:var(--green)">+38</div><div class="k">Sellers signed up</div></div>
    <div class="kpi"><div class="n">1,284</div><div class="k">North Star today</div></div>
    <div class="kpi"><div class="n">2.9%</div><div class="k">Of the total</div></div>
  </div>
  <div class="callout info"><span class="ico">◆</span>
    <span>Since <span class="mono">${f.key}</span> went on, the North Star has moved
    <b>+38 sellers</b>. That is a correlation this page can see, not a causal claim — to make it
    causal, run it as an experiment from <b>Ship › Experiments</b>.</span></div>`;
}

function historyPane(f){
  const items = [];
  ENVS.forEach(e=>{
    const st = STATE[e.id][f.key];
    if(st) items.push({when:st.when, s:st.s, txt:`<b>${st.who}</b> turned this ${st.s==="on"?"on":"off"} in <b>${ENVS.find(x=>x.id===e.id).name}</b>`, reason:st.reason});
  });
  for(let v=f.versions; v>=1; v--)
    items.push({when:`2026-0${v>1?8:7}-0${v+1} 10:0${v}`, s:"ver", txt:`Version <b>${v}</b> arrived from the catalog sync`, reason:null});
  items.sort((a,b)=>b.when.localeCompare(a.when));
  return `<div class="timeline">${items.map(i=>`
    <div class="tl ${i.s}"><span class="dot"></span>
      <div><div class="t">${i.txt}</div><div class="m">${i.when}</div>
      ${i.reason?`<div class="reason">Reason: ${i.reason}</div>`:""}</div></div>`).join("")}</div>
  <p class="hint" style="margin-top:14px">Every line is something a person or the sync actually did. The words here match the
  words on the buttons — “turned off” in the history, “Turn off” on the control.</p>`;
}

function settingsPane(f){
  const note = ENG_NOTE[f.key];
  return `
  <div class="field">
    <span class="lab">What this controls</span>
    ${APP.editingDesc
      ? `<div class="inline-edit">
          <input id="descedit" value="${esc(f.desc)}" maxlength="120">

          <span class="val">${esc(f.desc)}</span>

    <span class="lab">Type</span>
    <div class="chips">
      ${Object.entries(TYPE_WORDS).map(([k,v])=>`<button class="chip" aria-pressed="${f.type===k}"
        onclick="setMeta('${f.key}','type','${k}')">${v}</button>`).join("")}

    </div>
  </div>

function saveDesc(key){

function setMeta(key, field, val){

}

/* ── the confirm: names the consequence, reason is chips ── */
function confirmModal(o){
  const f = FEATURES.find(x=>x.key===o.key), env = ENVS.find(x=>x.id===APP.env);
  const on = o.turningOn, dangerous = f.type==="kill" && f.risk==="high" && !on && APP.env==="production";
  const consequence = on
    ? `<b>${esc(f.desc.replace(/\.$/,""))}</b> starts working for everyone in ${env.name}.`
    : `<b>${esc(f.desc.replace(/\.$/,""))}</b> stops working for everyone in ${env.name}.`;
  return `<div class="modal narrow" onclick="event.stopPropagation()">
    <div class="modal-head">
      <div><h2>${on?"Turn on":"Turn off"} <span class="k">${f.key}</span></h2>
        <div class="sub">In ${env.name}${dangerous?" — this is a live kill switch":""}</div></div>
      <button class="x" onclick="closeOverlay()" aria-label="Close">✕</button>
    </div>
    <div class="modal-body">
      <div class="callout ${dangerous?"":"info"}">
        <span class="ico">${dangerous?"▲":"◆"}</span>
        <span>${consequence}${dangerous?" Customers will notice within seconds.":""}</span>
      </div>
      <div class="field" style="margin-top:20px">
        <span class="lab">Why (recorded in the history)</span>
        <div class="chips">
          ${REASONS.map(r=>`<button class="chip" aria-pressed="${o.reason===r}"
            onclick="APP.overlay.reason='${r}';renderOverlay()">${r}</button>`).join("")}

    <div class="modal-foot">
      <span class="note">You can undo this for 10 seconds.</span>
      <button class="btn btn-ghost" onclick="closeOverlay()">Cancel</button>
      <button class="btn ${on?"btn-primary":"btn-danger"}" ${o.reason?"":"disabled"}
        onclick="applyChange('${f.key}',${on},'${o.reason}')">${on?"Turn on":"Turn off"} in ${env.name}</button>
    </div>
  </div>`;
}

/* ── create: three steps, one typed word ── */
const NAMESPACES = ["catalog","checkout","content","domain","events","growth","migrations","ml",
  "onboarding","ops","partners","promoter","seller","seller_agent","shipping","subdomain"];
function wizardModal(){
  const w = APP.wizard;
  const step = n=>`data-on="${w.step===n}" data-done="${w.step>n}"`;
  const full = `${w.ns}.${w.name||"…"}_enabled`;
  const bodies = {
    1:`<div class="field">
        <span class="lab">Name it</span>
        <div class="keyfield">
          <span class="sel"><select onchange="APP.wizard.ns=this.value;renderOverlay()">
            ${NAMESPACES.map(n=>`<option${n===w.ns?" selected":""}>${n}</option>`).join("")}</select></span>

          <span class="suffix">_enabled</span>
        </div>
        <p class="hint">The area comes from a list and the ending is fixed — the middle is the only thing anyone types
        in this whole console, because it is the word the code will import.</p>
        <div class="note-box" style="margin-top:12px"><span class="lab2">Code will import</span>
          <span class="mono" id="wprev" style="color:var(--gold-hot);font-size:13.5px">${full}</span></div>
      </div>`,
    2:`<div class="field">
        <span class="lab">What kind of switch is it?</span>
        <div class="cardpick">

/* Typing must not re-render (it would steal the caret), so the one control whose

function wizardName(el){
  const clean = el.value.toLowerCase().replace(/[^a-z0-9_]/g,"");
  if(el.value!==clean) el.value = clean;
  APP.wizard.name = clean;
  const prev = $("#wprev"); if(prev) prev.textContent = `${APP.wizard.ns}.${clean||"…"}_enabled`;
  const next = $("#wnext"); if(next) next.disabled = clean.length<3;
}
function toggleWizEnv(id){
  const w=APP.wizard, i=w.envs.indexOf(id);
  if(i<0) w.envs.push(id); else w.envs.splice(i,1);
  renderOverlay();
}
function createFeature(){
  const w = APP.wizard, key = `${w.ns}.${w.name}_enabled`;
  FEATURES.push({key, desc:"No description yet — add one in Settings.", type:w.type, risk:w.risk, versions:1});
  if(w.type==="kill") w.envs.forEach(e=>{
    STATE[e][key]={s:"on",v:1,who:"Daniel",when:nowStamp(),reason:"Planned rollout"};
  });
  FEATURES.sort((a,b)=>a.key.localeCompare(b.key));
  closeOverlay(); toast(`${key} created`); render();
}

/* ── SVG helpers. Hand-rolled, on the token set (D7). ─────────────────────── */
function pathFrom(data, w, h, pad){
  const max = Math.max(...data), min = Math.min(...data);
  const span = (max-min) || 1;
  const x = i => pad + i*( (w-pad*2) / (data.length-1) );
  const y = v => (h-pad) - ((v-min)/span)*(h-pad*2);
  return {d:"M"+data.map((v,i)=>`${x(i).toFixed(1)},${y(v).toFixed(1)}`).join("L"), x, y, max, min};
}

  const w=880, h=210, pad=18;

  const last = NORTH_STAR.series.length-1;

  return `
  <div class="plot" id="nsplot">
    <svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" role="img"
         aria-label="Signed-up sellers, weekly, ${NORTH_STAR.from} to ${NORTH_STAR.to}: ${NORTH_STAR.series[0]} rising to ${NORTH_STAR.now}.">
      <defs><linearGradient id="goldfade" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#e8b93c" stop-opacity=".22"/>
        <stop offset="100%" stop-color="#e8b93c" stop-opacity="0"/>
      </linearGradient></defs>
      ${gridY.map(gy=>`<line class="grid" x1="${pad}" y1="${gy.toFixed(1)}" x2="${w-pad}" y2="${gy.toFixed(1)}"/>`).join("")}
      <path class="area" d="${p.d}L${p.x(last).toFixed(1)},${h-pad}L${pad},${h-pad}Z"/>
      <path class="line" d="${p.d}"/>
      <circle class="endpt" cx="${p.x(last).toFixed(1)}" cy="${p.y(NORTH_STAR.series[last]).toFixed(1)}" r="4.5"/>
      <line class="cross" id="nscross" x1="0" y1="${pad}" x2="0" y2="${h-pad}" style="display:none"/>
      ${NORTH_STAR.series.map((v,i)=>`<rect class="hit" x="${(p.x(i)-14).toFixed(1)}" y="0" width="28" height="${h}"
        onmousemove="nsHover(event,${i},${v},${p.x(i).toFixed(1)},${p.y(v).toFixed(1)})"
        onmouseleave="nsOut()"><title>Week ${i+1}: ${v.toLocaleString()} sellers</title></rect>`).join("")}
    </svg>
    <div class="barscale"><span>${NORTH_STAR.from}</span><span>${NORTH_STAR.to}</span></div>
  </div>`;
}
function nsHover(ev,i,v,cx,cy){
  const host=document.getElementById("nsplot"); if(!host) return;
  const svg=host.querySelector("svg"), r=svg.getBoundingClientRect();
  const sx = r.width/880, sy = r.height/210;
  const cr=host.querySelector("#nscross");
  cr.setAttribute("x1",cx); cr.setAttribute("x2",cx); cr.style.display="";
  let t=host.querySelector(".tip");
  if(!t){ t=document.createElement("div"); t.className="tip"; host.appendChild(t); }
  t.innerHTML = `<b>${v.toLocaleString()}</b> sellers<span class="w">week ${i+1} of ${NORTH_STAR.series.length}</span>`;
  t.style.left = (cx*sx)+"px"; t.style.top = (cy*sy)+"px";
}
function nsOut(){
  const host=document.getElementById("nsplot"); if(!host) return;
  const cr=host.querySelector("#nscross"); if(cr) cr.style.display="none";
  const t=host.querySelector(".tip"); if(t) t.remove();
}

function sparkSVG(data){
  const w=200,h=30,pad=3;
  const p = pathFrom(data,w,h,pad);
  return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-hidden="true"><path d="${p.d}"/></svg>`;
}

function experimentDetailScreen(){
  const x = EXPERIMENTS.find(e=>e.key===APP.experiment) || EXPERIMENTS[0];
  const maxObs = Math.max(...x.variants.map(v=>Math.max(v.obs,v.exp)));
  /* CI drawn on a symmetric scale around zero, so "crosses zero" is visible
     rather than something you work out from two numbers. */
  const bound = Math.max(Math.abs(x.metric.lo), Math.abs(x.metric.hi)) * 1.15;
  const pos = v => ((v + bound) / (bound*2)) * 100;
  return `
  <div class="crumbrow">
    <button onclick="closeExperiment()">← Experiments</button>
    <span class="sep">/</span><span class="mono">${x.key}</span>
  </div>
  <div class="page-head">
    <div><h1 class="mono" style="font-size:23px">${x.key}</h1><p>${x.hyp}</p></div>
    <div class="spacer"></div>
    ${expStatusPill(x)}
  </div>

  ${x.status==="decided"
    ? `<div class="answer"><b>Decided: ${OUTCOME_WORDS[x.outcome].toLowerCase()}.</b>
        The treatment won by ${x.metric.lift}% and the decision is recorded with its reason.</div>`
    : x.ready
      ? `<div class="answer"><b>You can decide this one.</b> The split checks out, both groups have
          enough people, and the interval does not cross zero — so the difference is real.</div>`
      : `<div class="answer"><b>You cannot decide this yet, and here is exactly why.</b>
          ${x.blockers.length} thing${x.blockers.length>1?"s are":" is"} in the way.</div>`}

  ${x.blockers.length?`
  <div class="listcard" style="padding:18px 20px;margin-bottom:16px">
    <span class="rail-label" style="margin-bottom:10px">What is in the way</span>
    <div class="blockers">
      ${x.blockers.map(b=>`<div class="blocker"><span class="no">✕</span>
        <span><b>${BLOCKER_WORDS[b][0]}.</b> ${BLOCKER_WORDS[b][1]}</span></div>`).join("")}
    </div>
  </div>`:""}

  <div class="listcard" style="padding:22px;margin-bottom:16px">
    <span class="rail-label" style="margin-bottom:14px">Who saw what</span>
    <div class="vbars">
      ${x.variants.map(v=>`
        <div class="vbar">
          <div class="t"><span class="nm"><i class="${v.k}"></i>${v.k==="control"?"Control":"Treatment"}</span>
            <span class="num">${v.obs.toLocaleString()} of ${v.exp.toLocaleString()} needed</span></div>
          <div class="track"><div class="fill ${v.k}" style="width:${(v.obs/maxObs*100).toFixed(1)}%"></div></div>
          <div class="foot">${v.obs>=v.exp?"Enough people":`${(v.exp-v.obs).toLocaleString()} more needed before this counts`}</div>
        </div>`).join("")}
    </div>
    <p class="hint" style="margin-top:14px">Two groups, two colours — grey and blue, the only pair that
    survives a colour-blindness check on this palette. A third variant would be a third row, never a
    third hue.</p>
  </div>

  <div class="listcard" style="padding:22px;margin-bottom:16px">
    <span class="rail-label" style="margin-bottom:6px">${x.metric.name}</span>
    <div class="hero" style="margin-bottom:2px">
      <span class="n" style="font-size:34px;color:${x.metric.lo>0?"var(--green)":"var(--crema)"}">${x.metric.lift>0?"+":""}${x.metric.lift}%</span>
      <span class="delta ${x.metric.lo>0?"up":""}" style="color:var(--dim)">${x.metric.control}% → ${x.metric.treatment}%</span>
    </div>
    <div class="hero-sub">How sure we are, ${x.metric.lo>0?"and it does not cross zero":"and it still crosses zero"}</div>
    <div class="ci">
      <div class="axis0" style="left:${pos(0).toFixed(1)}%"></div>
      <div class="rng" style="left:${pos(x.metric.lo).toFixed(1)}%;width:${(pos(x.metric.hi)-pos(x.metric.lo)).toFixed(1)}%"></div>
      <div class="pt" style="left:${pos(x.metric.lift).toFixed(1)}%"></div>
    </div>
    <div class="cikey"><span>${x.metric.lo>0?"+":""}${x.metric.lo}%</span>
      <span style="color:var(--dim)">no difference</span><span>+${x.metric.hi}%</span></div>
    <p class="hint" style="margin-top:12px">${x.metric.lo>0
      ? "The whole range sits above zero, so the treatment is better — the only question left is by how much."
      : "The range still includes zero, which means “no difference” is one of the answers the data allows. That is not a small effect; it is not yet an answer."}</p>
  </div>

  <div class="listcard" style="padding:22px;margin-bottom:16px">
    <span class="rail-label" style="margin-bottom:12px">Guardrails</span>
    <div class="wordlist">
      ${x.guardrails.map(g=>`<div>
        <span class="was">${g.name}</span>
        <span class="arw">→</span>
        <span class="now" style="color:${g.ok?"var(--dim)":"var(--gold-hot)"}">${g.d>0?"+":""}${g.d}${g.unit||"%"}
          ${g.ok?"":" — worth a look before you ship"}</span>
      </div>`).join("")}
    </div>
    <p class="hint" style="margin-top:10px">A guardrail is a thing that must not get worse. It never
    decides the experiment; it can stop you shipping a win that cost something else.</p>
  </div>

  <div class="listcard" style="padding:22px;margin-bottom:16px">
    <span class="rail-label" style="margin-bottom:10px">Was the split honest?</span>
    <div style="display:flex;align-items:center;gap:12px;font-size:13.5px">
      ${x.srm.status==="clear"
        ? `<span class="pill on"><span class="dot"></span>Split checks out</span>
           <span style="color:var(--dim)">People were divided as designed
           <span class="mono" style="color:var(--dim-2);font-size:12px">(χ² ${x.srm.chi}, p ${x.srm.p})</span></span>`
        : `<span class="pill never"><span class="dot"></span>Cannot tell yet</span>
           <span style="color:var(--dim)">Too few people to check the split.</span>`}
    </div>
    <p class="hint" style="margin-top:10px">If the split is wrong, every number above is measuring the
    split. This runs before the result, not after.</p>
  </div>

  <div class="listcard" style="padding:22px">
    <span class="rail-label" style="margin-bottom:4px">The decision</span>
    <p style="font-size:13px;color:var(--dim);margin-bottom:4px">
      Five outcomes, and the reason is kept with whichever you pick.</p>
    <div class="outcomes">
      ${Object.entries(OUTCOME_WORDS).map(([k,w])=>`
        <button class="outcome ${x.status==="decided"&&x.outcome===k?"primary":""}"
          ${x.ready?"":"disabled"}
          onclick="toast('Records the decision with your reason — corrections are kept, never overwritten')">${w}</button>`).join("")}
    </div>
    ${x.ready?"":`<p class="hint" style="margin-top:11px">Greyed out until the blockers above are
      cleared. Deciding on numbers that cannot support a decision is the thing this page exists to
      prevent.</p>`}
  </div>`;
}

/* ── Hub › Roadmap ───────────────────────────────────────────────────────── */
function hubRoadmapScreen(){
  const building = EPICS.filter(e=>e.state==="building");
  const queued = EPICS.filter(e=>e.state==="queued");
  /* ── The track and the numbers beside it come from ONE array ──────────────
     First cut of this screen stated the legend counts separately from the nodes
     it drew, and they disagreed — the picture said 23 shipped while the tile
     said 24. That is the exact defect this epic exists to kill, produced by me,
     on the page about killing it. Counts are now DERIVED from `nodes`, so they
     cannot drift from the thing they describe.

     The sequence runs 1…26 and there are 27 epics, because one has never been
     given a build-order number. It is in the list and not on the track, and the
     page says so rather than quietly padding the track to make the arithmetic
     look right. */
  const nodes = [];
  const knownShipped = EPICS.filter(e=>e.state==="shipped").length;
  let fillersLeftToShip = HUB_COUNTS.shipped - knownShipped;
  for(let i=1;i<=HUB_COUNTS.sequence;i++){
    const known = EPICS.find(e=>e.o===i);
    if(known){ nodes.push(known.state==="shipped"?(known.recent?"shipped recent":"shipped"):known.state); }
    else if(fillersLeftToShip>0){ nodes.push("shipped"); fillersLeftToShip--; }
    else nodes.push("queued");
  }
  const n = s => nodes.filter(x=>x.split(" ")[0]===s).length;
  const unplaced = HUB_COUNTS.epics - HUB_COUNTS.sequence;
  return `
  <div class="page-head">
    <div><h1>Roadmap</h1>
      <p>Every epic this project has built, in the one order it was built in.</p></div>
    <div class="spacer"></div>
    <button class="btn btn-ghost" onclick="leaveHub()">← Back to the console</button>
  </div>

  <div class="answer"><b>${HUB_COUNTS.shipped} of ${HUB_COUNTS.epics} epics have shipped.</b>
    One is being built now and ${queued.length} are scaffolded and waiting for a bet.</div>

  <div class="tiles" style="margin:18px 0 20px">
    <div class="tile"><div class="k">Shipped</div><div class="n up">${HUB_COUNTS.shipped}</div>
      <div class="d">of ${HUB_COUNTS.epics} epics</div></div>
    <div class="tile"><div class="k">Building now</div><div class="n warn">${building.length}</div>
      <div class="d">${building[0]?building[0].slug:"—"}</div></div>
    <div class="tile"><div class="k">Sprints tracked</div><div class="n">${HUB_COUNTS.sprints}</div>
      <div class="d">across every epic</div></div>
    <div class="tile"><div class="k">Ideas in the funnel</div><div class="n">${HUB_COUNTS.seeds}</div>
      <div class="d">seeds, not all bet on</div></div>
  </div>

  <div class="listcard" style="padding:20px 22px;margin-bottom:18px">
    <span class="rail-label" style="margin-bottom:9px">The build order, 1 to ${HUB_COUNTS.sequence}</span>
    <div class="track">${nodes.map((s,i)=>`<i class="${s}" title="#${i+1}"></i>`).join("")}</div>
    <div class="trackkey">
      <span><i class="shipped"></i>Shipped <b>${n("shipped")}</b></span>
      <span><i class="building"></i>Building now <b>${n("building")}</b></span>
      <span><i class="queued"></i>Scaffolded, not bet <b>${n("queued")}</b></span>
    </div>
    <p class="hint">One sequence, not a priority score — shipped epics keep their number, so this reads
    left to right as the order things actually happened. Twenty-six nodes side by side would be a
    barcode, so the track carries the shape and the list below carries the names.
    ${unplaced>0?`<br><b style="color:var(--gold-hot)">${unplaced} epic has no build-order number yet</b>,
    so it is in the list below and not on the track. Padding the track to make the arithmetic look
    right is how a board starts lying.`:""}</p>
  </div>

  <span class="rail-label" style="margin-bottom:10px">Most recent first</span>
  <div class="listcard">
    ${[...EPICS].sort((a,b)=>b.o-a.o).map(e=>`
      <div class="epic" onclick="openEpic('${e.slug}')">
        <span class="ord">${e.o}</span>
        <div class="nm"><b>${e.name}</b><span>${e.why}</span></div>
        <span class="prog">${e.done}/${e.total} stories</span>
        <span class="st">${
          e.state==="shipped" ? `<span class="pill on"><span class="dot"></span>Shipped</span>`
          : e.state==="building" ? `<span class="pill never" style="border-style:solid;color:var(--gold);border-color:var(--gold-deep)"><span class="dot"></span>Building now</span>`
          : `<span class="tag unclassified">Scaffolded</span>`}</span>
      </div>`).join("")}
  </div>
  <p class="hint">Showing ${EPICS.length} of ${HUB_COUNTS.epics}. This board is generated from each
  epic's own frontmatter — it is a view, never a thing anybody ticks by hand.</p>`;
}

  <div class="dests" style="margin-top:18px">

      <div class="dest" data-status="${d.status}">
        <div class="h">
          <span class="lamp" title="${LABEL[d.status]}">${LAMP[d.status]}</span>

        <div class="why">${d.why}</div>
        <ul class="lights">

        <div style="margin-top:auto;padding-top:8px;font-size:11.5px;color:var(--dim-2);
          font:600 10.5px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase">${LABEL[d.status]}</div>
      </div>`).join("")}
  </div>

  <div class="haze">
    <h3>Further out — on the horizon</h3>
    <p>Ideas that exist as seeds and have never been bet on. They are deliberately hazy: writing them
    down is cheap, and pretending they are planned is the expensive part.</p>
    <div class="hazelist">
      ${HAZE.map(h=>`<span class="hazeitem mono">${h}</span>`).join("")}
    </div>
  </div>

  <div class="callout info" style="margin-top:22px"><span class="ico">◆</span>
    <span><b>Three strengths of one colour, not three colours.</b> Lit, partly lit and on the way is a

function hubReportScreen(){
  return `
  <div class="page-head">
    <div><h1>Report</h1><p>What this pod shipped, written for somebody who was not here.</p></div>
    <div class="spacer"></div>
    <button class="btn btn-ghost" onclick="toast('Copies a share link — the same scoped, revocable kind as Setup › Share links')">Share this</button>
    <button class="btn btn-ghost" onclick="leaveHub()">← Console</button>
  </div>

  <div class="prov">
    <span>Generated <b>2026-08-29 06:12</b></span><span class="sep">·</span>
    <span>from <b>27 epic READMEs</b> and <b>79 sprint files</b></span><span class="sep">·</span>
    <span class="pill on" style="padding:3px 9px"><span class="dot"></span>Live</span>
    <span style="margin-left:auto">Nothing here is typed by hand.</span>
  </div>

  <div class="doc">
    <h2>What shipped</h2>
    <p><strong>Twenty-four epics, seventy-nine sprints.</strong> The signed-in product went from
    sixteen destinations and no information architecture to four, and the flag console stopped
    showing the storage model and started showing the job.</p>
    <ul>
      <li>A feature is now one page — value, environments, funnel and impact, as tabs.</li>
      <li>Credentials moved from three pages to one, and the boundary got tighter, not looser.</li>
      <li>Every user-facing flag word goes through one module, so the words on the buttons and the
      words in the history are the same words.</li>
    </ul>

    <h2>What we learned</h2>
    <p><strong>Two lessons cost real time and are worth stating plainly.</strong> A reference design
    that is called "inspiration" produces a build that satisfies every acceptance criterion and looks
    like a different product — that rule is now amended. And a document whose whole claim is
    "measured, not described" earns the same suspicion as code: two numbers in the console contract
    could not be reproduced.</p>

    <h2>What is next</h2>
    <p>One design system across every surface, with a gate that can go red on the way a page looks —
    scaffolded as <span class="mono">design-system-rails</span>, thirty-four stories, not yet bet on.</p>
  </div>

  <div class="callout info" style="margin-top:22px"><span class="ico">◆</span>
    <span>The report is prose, and prose is the one thing here a person still writes — so the stamp
    at the top says <b>what it was generated from and when</b>. A report that cannot tell you how
    stale it is, is a screenshot.</span></div>`;
}

function hubContent(){
  if(APP.hubTab==="roadmap") return APP.epic ? hubEpicScreen() : hubRoadmapScreen();
  if(APP.hubTab==="horizon") return hubHorizonScreen();
  return hubReportScreen();
}

/* ═══════════════════════════════════════════════════════════════════════════
   BATCH 4 — the doors.

   ── One correction to the plan, found by reading the route ────────────────
   sprint-6.md, as I wrote it, asks for "the expired state" of a share link as
   a designed page. `app/s/[token]/page.tsx` does not have one, and that is a
   DECISION rather than a gap: it calls notFound() for unknown, malformed,
   expired AND revoked alike, so the page cannot tell an attacker which of
   those a token is. So there is no expired state to design — there is a 404,
   every one of those cases lands on it, and the 404 is what needs designing.
   The sprint doc is corrected rather than the route.
   ═══════════════════════════════════════════════════════════════════════════ */

  return `
  <div class="pubbar">${MARK}<b>Golden Frijoles</b><span class="sp"></span>
    <button class="btn btn-ghost btn-sm" onclick="openDoor('login')">Sign in</button></div>
  <div class="gone">
    <div class="glyph">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--dim-2)"
        stroke-width="1.5" stroke-linecap="round" aria-hidden="true">
        <path d="M9.5 14.5 14.5 9.5"/><path d="M10.8 7.3 12.6 5.5a4 4 0 0 1 5.7 5.7l-1.8 1.8"/>
        <path d="M13.2 16.7 11.4 18.5a4 4 0 0 1-5.7-5.7l1.8-1.8"/>
      </svg>
    </div>
    <h1>This link is not working</h1>
    <p>It may have expired, been switched off, or never have been a link at all. Whoever shared it
    can make you a new one.</p>
    <p style="color:var(--dim-2);font-size:13px">We deliberately do not say which of those it is —

    <div class="acts">

/* ── /talk ───────────────────────────────────────────────────────────────── */
function talkScreen(){
  return `
  <div class="pubbar">${MARK}<b>Golden Frijoles</b><span class="sp"></span>
    <button class="btn btn-ghost btn-sm" onclick="openDoor('install')">Try the demo</button>
    <button class="btn btn-ghost btn-sm" onclick="openDoor('login')">Sign in</button></div>
  <div class="pubwrap wide">
    <h1>Let's work out whether a Pod is worth it</h1>
    <p class="lede">Thirty minutes, no deck. Bring a number you want to move and we will say plainly
    whether this is the thing that moves it.</p>
    <div class="talkgrid">
      <div class="talkslot"><span>The booking calendar loads here.<br>
        It is somebody else's iframe, so it gets a bordered slot of its own rather than being
        dressed up to look like part of the page.</span></div>
      <div class="talkaside">
        <div class="item"><b>What we will actually do</b>
          <span>Look at your funnel, pick the one number worth moving first, and name what would have
          to be true for it to move.</span></div>
        <div class="item"><b>What you leave with</b>
          <span>A written answer either way — including "not yet, and here is what to do instead."</span></div>
        <div class="item"><b>Would rather just look?</b>
          <span>The demo connector is live and needs no call.
            <button style="color:var(--gold);display:block;margin-top:7px" onclick="openDoor('install')">Point Claude at it →</button></span></div>
      </div>
    </div>
    <div class="callout info" style="margin-top:24px"><span class="ico">◆</span>
      <span>A third-party embed cannot be made to match the design system, so it is not pretended
      into one — it gets a dashed slot that says "this is somebody else's frame". Styling around an
      iframe until it almost matches is worse than admitting the seam.</span></div>
  </div>`;
}

const DOOR_SCREENS = {login:loginScreen, signup:signupScreen, install:installScreen,
  share:shareScreen, gone:goneScreen, talk:talkScreen};

function renderDoors(){
  let layer = document.querySelector(".doorlayer");
  const on = !!APP.door;
  document.querySelector(".topbar").style.display = on ? "none" : "";
  document.querySelector(".tabs").style.display = on ? "none" : "";
  document.querySelector(".frame").style.display = on ? "none" : "";
  if(!on){ if(layer) layer.remove(); return; }
  if(!layer){ layer=document.createElement("div"); layer.className="doorlayer"; document.body.appendChild(layer); }
  layer.innerHTML = DOOR_SCREENS[APP.door]();
  layer.scrollTop = 0;
}

/* ═══ render ═══ */
/* One screen per rail entry. The router is flat on purpose: a section plus a rail
   entry is the whole address, which is what makes the nav explainable. */
const SCREENS = {
  today:      todayScreen,
  overview:   northStarScreen,
  journeys:   ()=>APP.journey ? journeyDetailScreen() : journeysScreen(),
  scenarios:  scenariosScreen,
  features:   featuresScreen,
  experiments:()=>APP.experiment ? experimentDetailScreen() : experimentsScreen(),
  scheduled:  scheduledScreen,
  activity:   historyScreen,
  connect:    connectScreen,
  keys:       keysScreen,
  destinations:destinationsScreen,
  shares:     sharesScreen,
};
function renderContent(){
  const c = $("#content");
  /* A standalone route (/app/funnel/..., /app/tasks) is a MOUNT of a design that
     also lives inside a section — never a fifth place to look. */
  if(APP.surface==="hub"){ c.innerHTML = hubContent(); return; }
  if(APP.route==="funnelpage"){ c.innerHTML = funnelPageScreen(); return; }
  if(APP.route==="taskspage"){ c.innerHTML = tasksPageScreen(); return; }
  if(APP.section==="today"){ c.innerHTML = todayScreen2(); return; }
  c.innerHTML = (SCREENS[APP.rail] || featuresScreen)();
}
function openFunnelPage(){ APP.route="funnelpage"; APP.section="ship"; APP.rail="features"; render(); }
function render(){ renderDoors(); if(APP.door) return; renderChrome(); renderContent(); renderOverlay(); markViewMenu(); }

let toastTimer;
function toast(msg, undoKey){
  const old=$("#toast"); if(old) old.remove();
  const d=document.createElement("div");
  d.className="toast"; d.id="toast";
  d.innerHTML=`<span class="dot"></span><span>${esc(msg)}</span>`+
    (undoKey?`<button onclick="undoChange('${esc(undoKey)}')">Undo</button>`:"");
  document.body.appendChild(d);
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>d.remove(), undoKey?10000:3200);
}

render();
</script>
