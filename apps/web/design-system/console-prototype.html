<title>Golden Beans Console Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">

<style>
/* ─────────────────────────────────────────────────────────────────────────
   Golden Beans · flags console — Flagsmith's structure, Golden's skin.
   Palette lifted verbatim from references/design/assets/tokens.css.
   Single-theme by commitment: the product sets color-scheme: dark.
   ───────────────────────────────────────────────────────────────────────── */
:root{
  --roast:#16120d; --roast-2:#1c1710; --card:#241d14; --card-2:#2b2318; --card-3:#332a1d;
  --line:#3a3023; --line-soft:#2e2619;
  --crema:#f5ead6; --dim:#b8a888; --dim-2:#8d8069;
  --gold:#e8b93c; --gold-hot:#ffd45e; --gold-deep:#8a6a1e;
  --green:#7fd069; --green-deep:#2c5e22; --red:#e86a5e; --red-deep:#6e2a22; --blue:#6db3e8;
  --sans:'Archivo',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  --r:8px; --r-lg:12px;
  --shadow:0 18px 44px rgb(0 0 0 / 44%);
  --shadow-hi:0 24px 64px rgb(0 0 0 / 62%);
  --t:140ms cubic-bezier(.2,0,.2,1);
}
*,*::before,*::after{box-sizing:border-box}
html{color-scheme:dark}
body{
  margin:0; background:var(--roast); color:var(--crema);
  font-family:var(--sans); font-size:14px; line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4,p,ul,ol{margin:0}
ul{list-style:none;padding:0}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
a{color:var(--gold);text-decoration:none}
a:hover{color:var(--gold-hot)}
code,.mono{font-family:var(--mono);font-variant-ligatures:none}
:focus-visible{outline:2px solid var(--gold-hot);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ── chrome ─────────────────────────────────────────────────────────────── */
.topbar{
  display:flex;align-items:center;gap:14px;height:54px;padding:0 20px;
  background:var(--roast-2);border-bottom:1px solid var(--line);
  position:sticky;top:0;z-index:40;
}
.mark{
  width:26px;height:26px;border-radius:7px;flex:none;
  background:linear-gradient(140deg,var(--gold-hot),var(--gold-deep));
  display:grid;place-items:center;color:#241d14;font-weight:700;font-size:12px;letter-spacing:-.02em;
}
.crumb{display:flex;align-items:center;gap:8px;font-size:13px}
.crumb b{font-weight:600}
.crumb .sep{color:var(--dim-2)}
.crumb-btn{
  display:flex;align-items:center;gap:6px;padding:4px 8px;border-radius:6px;
  border:1px solid transparent;color:var(--crema);transition:background var(--t),border-color var(--t);
}
.crumb-btn:hover{background:var(--card);border-color:var(--line)}
.crumb-btn .chev{color:var(--dim-2);font-size:10px}
.topbar-right{margin-left:auto;display:flex;align-items:center;gap:10px}
.proto-pill{
  font-family:var(--mono);font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;
  color:var(--gold);border:1px solid var(--gold-deep);background:rgb(232 185 60 / 9%);
  padding:3px 8px;border-radius:999px;
}
.cmdk{
  display:flex;align-items:center;gap:10px;padding:5px 9px 5px 12px;border-radius:7px;
  border:1px solid var(--line);background:var(--card);color:var(--dim-2);font-size:13px;
  transition:border-color var(--t),color var(--t);
}
.cmdk:hover{border-color:var(--dim-2);color:var(--crema)}
.cmdk kbd{
  font-family:var(--mono);font-size:10.5px;padding:2px 5px;border-radius:4px;
  border:1px solid var(--line);background:var(--roast-2);color:var(--dim-2);
}
.avatar{
  width:27px;height:27px;border-radius:50%;flex:none;font-size:11.5px;font-weight:700;
  background:var(--card-3);border:1px solid var(--line);color:var(--crema);
  display:grid;place-items:center;transition:border-color var(--t);
}
.avatar:hover{border-color:var(--gold-deep)}
.badge-dot{
  display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--gold);
  margin-left:6px;vertical-align:middle;
}
.palette{
  width:100%;max-width:560px;background:var(--card);border:1px solid var(--line);
  border-radius:var(--r-lg);box-shadow:var(--shadow-hi);overflow:hidden;
  animation:rise 140ms cubic-bezier(.2,0,.2,1);
}
.palette input{
  width:100%;padding:16px 20px;background:transparent;border:none;border-bottom:1px solid var(--line);
  color:var(--crema);font:inherit;font-size:16px;
}
.palette input:focus{outline:none}
.palette input::placeholder{color:var(--dim-2)}
.palette .results{max-height:340px;overflow-y:auto;padding:6px}
.palette .res{
  display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:7px;width:100%;
  text-align:left;transition:background var(--t);
}
.palette .res:hover,.palette .res.sel{background:var(--card-3)}
.palette .res .kind{
  font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim-2);
  border:1px solid var(--line);border-radius:4px;padding:1px 6px;flex:none;
}
.palette .res .nm{font-size:13.5px}
.palette .res .nm.mono{font-family:var(--mono);font-size:13px}
.palette .res .whr{margin-left:auto;font-size:12px;color:var(--dim-2)}
.palette .none{padding:26px;text-align:center;color:var(--dim-2);font-size:13.5px}
.palette .foot{
  padding:9px 16px;border-top:1px solid var(--line);background:var(--roast-2);
  font-size:11.5px;color:var(--dim-2);font-family:var(--mono);
}
.dormant{
  display:flex;align-items:center;gap:12px;padding:13px 16px;width:100%;text-align:left;
  background:var(--roast-2);transition:background var(--t);border-top:1px solid var(--line);
}
.dormant:hover{background:var(--card-2)}
.dormant .tw{
  width:26px;height:26px;border-radius:7px;border:1px dashed var(--line);flex:none;
  display:grid;place-items:center;color:var(--dim-2);font-size:11px;
}
.dormant .t{display:block;font-size:14px;font-weight:600}
.dormant .d{display:block;font-size:12.5px;color:var(--dim-2);margin-top:3px;max-width:78ch}
.dormant .go{margin-left:auto;font-size:12.5px;color:var(--gold);font-weight:600;white-space:nowrap}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-bottom:22px}
.tile{padding:16px 18px;border-radius:var(--r-lg);background:var(--card);border:1px solid var(--line)}
.tile .k{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--dim-2);font-weight:600}
.tile .n{font-family:var(--mono);font-size:28px;font-weight:600;margin-top:8px;font-variant-numeric:tabular-nums}
.tile .d{font-size:12.5px;color:var(--dim);margin-top:4px}
.tile .n.up{color:var(--green)} .tile .n.warn{color:var(--gold-hot)}
.copyrow{
  display:flex;align-items:center;gap:0;border:1px solid var(--line);border-radius:var(--r);
  background:var(--roast-2);overflow:hidden;
}
.copyrow code{
  flex:1;padding:12px 14px;font-size:13px;color:var(--gold-hot);overflow-x:auto;white-space:nowrap;
}
.copyrow button{
  padding:12px 16px;border-left:1px solid var(--line);background:var(--card-2);
  font-size:13px;font-weight:600;color:var(--crema);white-space:nowrap;transition:background var(--t);
}
.copyrow button:hover{background:var(--card-3)}
.steplist{counter-reset:s;display:flex;flex-direction:column;gap:14px;list-style:none;padding:0;margin:0}
.steplist li{
  counter-increment:s;position:relative;padding-left:38px;font-size:14px;color:var(--dim);line-height:1.6;
}
.steplist li::before{
  content:counter(s);position:absolute;left:0;top:0;width:25px;height:25px;border-radius:50%;
  border:1px solid var(--gold-deep);color:var(--gold);display:grid;place-items:center;
  font-family:var(--mono);font-size:12px;
}
.steplist li b{color:var(--crema)}

.tabs{
  display:flex;gap:2px;padding:0 20px;background:var(--roast-2);
  border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none;
}
.tabs::-webkit-scrollbar{display:none}
.tab{
  padding:11px 12px 10px;font-size:13px;color:var(--dim);white-space:nowrap;
  border-bottom:2px solid transparent;transition:color var(--t),border-color var(--t);
}
.tab:hover{color:var(--crema)}
.tab[aria-selected="true"]{color:var(--crema);border-bottom-color:var(--gold);font-weight:500}

/* ── frame ──────────────────────────────────────────────────────────────── */
.frame{display:grid;grid-template-columns:236px minmax(0,1fr);align-items:start;gap:0}
.rail{
  border-right:1px solid var(--line);padding:18px 14px 40px;
  position:sticky;top:98px;height:calc(100vh - 98px);overflow-y:auto;
}
.rail-label{
  font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--dim-2);
  font-weight:600;margin-bottom:7px;display:block;
}
.envpick{position:relative;margin-bottom:22px}
.envpick>button{
  width:100%;display:flex;align-items:center;gap:9px;padding:9px 11px;
  background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  text-align:left;transition:border-color var(--t),background var(--t);
}
.envpick>button:hover{border-color:var(--gold-deep)}
.envpick>button .nm{font-weight:600;font-size:13.5px}
.envpick>button .chev{margin-left:auto;color:var(--dim-2);font-size:10px}
.env-dot{width:8px;height:8px;border-radius:50%;flex:none}
.env-dot.production{background:var(--gold)}
.env-dot.preview{background:var(--blue)}
.env-dot.development{background:var(--dim-2)}
.envmenu{
  position:absolute;top:calc(100% + 5px);left:0;right:0;z-index:30;
  background:var(--card-2);border:1px solid var(--line);border-radius:var(--r);
  box-shadow:var(--shadow);padding:5px;
}
.envmenu button{
  width:100%;display:flex;align-items:center;gap:9px;padding:8px 9px;border-radius:6px;
  text-align:left;font-size:13.5px;transition:background var(--t);
}
.envmenu button:hover{background:var(--card-3)}
.envmenu .cnt{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--dim-2)}

.railnav{display:flex;flex-direction:column;gap:1px}
.railnav button{
  display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:7px;
  font-size:13.5px;color:var(--dim);text-align:left;transition:background var(--t),color var(--t);
}
.railnav button:hover{background:var(--card);color:var(--crema)}
.railnav button[aria-current="true"]{background:var(--card-2);color:var(--crema);font-weight:600}
.railnav .ico{width:15px;flex:none;color:var(--dim-2);display:grid;place-items:center}
.railnav button[aria-current="true"] .ico{color:var(--gold)}
.railnav .pip{
  margin-left:auto;font-family:var(--mono);font-size:10.5px;color:var(--dim-2);
}

.content{padding:26px 30px 90px;max-width:1180px}
.page-head{display:flex;align-items:flex-start;gap:16px;margin-bottom:20px;flex-wrap:wrap}
.page-head h1{font-size:23px;font-weight:700;letter-spacing:-.01em}
.page-head p{color:var(--dim);font-size:13.5px;margin-top:4px;max-width:62ch}
.page-head .spacer{margin-left:auto}

/* ── buttons ────────────────────────────────────────────────────────────── */
.btn{
  display:inline-flex;align-items:center;gap:7px;padding:8px 14px;border-radius:var(--r);
  font-size:13.5px;font-weight:600;border:1px solid transparent;white-space:nowrap;
  transition:background var(--t),border-color var(--t),color var(--t),transform 90ms;
}
.btn:active{transform:translateY(1px)}
.btn-primary{background:var(--gold);color:#241d14;box-shadow:0 2px 0 var(--gold-deep)}
.btn-primary:hover{background:var(--gold-hot)}
.btn-ghost{border-color:var(--line);color:var(--crema);background:var(--card)}
.btn-ghost:hover{border-color:var(--dim-2);background:var(--card-2)}
.btn-quiet{color:var(--dim);padding:8px 10px}
.btn-quiet:hover{color:var(--crema);background:var(--card)}
.btn-danger{background:var(--red);color:#2a100c;box-shadow:0 2px 0 var(--red-deep)}
.btn-danger:hover{filter:brightness(1.08)}
.btn[disabled]{opacity:.42;cursor:not-allowed;box-shadow:none}
.btn-sm{padding:6px 11px;font-size:12.5px}

/* ── summary strip ──────────────────────────────────────────────────────── */
.summary{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px;margin-bottom:18px;
}
.stat{
  display:block;width:100%;text-align:left;padding:13px 15px;border-radius:var(--r-lg);
  background:var(--card);border:1px solid var(--line);
  transition:border-color var(--t),background var(--t);
}
.stat:hover{border-color:var(--dim-2)}
.stat[aria-pressed="true"]{border-color:var(--gold);background:var(--card-2)}
.stat .n{font-family:var(--mono);font-size:26px;font-weight:600;line-height:1.1;font-variant-numeric:tabular-nums}
.stat .k{font-size:12.5px;color:var(--dim);margin-top:3px;display:flex;align-items:center;gap:6px}
.stat.on .n{color:var(--green)}
.stat.off .n{color:var(--red)}
.stat.never .n{color:var(--dim-2)}
.stat.all .n{color:var(--crema)}
.answer{
  margin-bottom:18px;padding:12px 15px;border-radius:var(--r-lg);
  background:linear-gradient(90deg,rgb(232 185 60 / 8%),transparent 70%);
  border:1px solid var(--line);border-left:2px solid var(--gold);
  font-size:13.5px;color:var(--crema);
}
.answer b{font-weight:600}
.answer .mono{color:var(--gold-hot)}

/* ── toolbar ────────────────────────────────────────────────────────────── */
.toolbar{
  display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px;
}
.search{
  position:relative;flex:1 1 250px;min-width:190px;
}
.search input{
  width:100%;padding:8px 11px 8px 32px;border-radius:var(--r);
  background:var(--card);border:1px solid var(--line);color:var(--crema);
  font:inherit;font-size:13.5px;transition:border-color var(--t);
}
.search input::placeholder{color:var(--dim-2)}
.search input:focus{border-color:var(--gold-deep);outline:none}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--dim-2)}
.sel{position:relative}
.sel select{
  appearance:none;padding:8px 28px 8px 11px;border-radius:var(--r);
  background:var(--card);border:1px solid var(--line);color:var(--crema);
  font:inherit;font-size:13.5px;cursor:pointer;transition:border-color var(--t);
}
.sel select:hover{border-color:var(--dim-2)}
.sel::after{
  content:"";position:absolute;right:11px;top:50%;width:5px;height:5px;pointer-events:none;
  border-right:1.5px solid var(--dim-2);border-bottom:1.5px solid var(--dim-2);
  transform:translateY(-70%) rotate(45deg);
}
.sel select option{background:var(--card-2)}

/* ── feature list ───────────────────────────────────────────────────────── */
.listcard{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden}
.listhead{
  display:flex;align-items:center;gap:12px;padding:9px 16px;
  border-bottom:1px solid var(--line);background:var(--roast-2);
  font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim-2);font-weight:600;
}
.listhead .h-state{width:190px;flex:none}
.listhead .h-meta{width:150px;flex:none}
.listhead .h-act{width:96px;flex:none;text-align:right}

.grp{
  padding:8px 16px;background:var(--roast-2);border-bottom:1px solid var(--line-soft);
  border-top:1px solid var(--line);
  font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);font-weight:600;
  display:flex;align-items:center;gap:8px;
}
.grp .cnt{font-family:var(--mono);color:var(--dim-2);letter-spacing:0;text-transform:none;font-size:11.5px}
.grp .bar{width:3px;height:12px;border-radius:2px;background:var(--dim-2)}
.grp.on .bar{background:var(--green)}
.grp.off .bar{background:var(--red)}

.row{
  display:flex;align-items:center;gap:12px;padding:12px 16px;width:100%;text-align:left;
  border-bottom:1px solid var(--line-soft);transition:background var(--t);position:relative;
}
.row:last-child{border-bottom:none}
.row:hover{background:var(--card-2)}
.row-main{flex:1 1 auto;min-width:0;cursor:pointer}
.row-key{
  font-family:var(--mono);font-size:13.5px;font-weight:500;color:var(--crema);
  display:flex;align-items:center;gap:8px;
}
.row:hover .row-key{color:var(--gold-hot)}
.row-desc{
  font-size:12.5px;color:var(--dim);margin-top:2px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:60ch;
}
.row-state{width:190px;flex:none}
.row-meta{width:150px;flex:none;display:flex;gap:6px;flex-wrap:wrap}
.row-act{width:96px;flex:none;display:flex;align-items:center;justify-content:flex-end;gap:6px}

.pill{
  display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:999px;
  font-size:12px;font-weight:600;border:1px solid;
}
.pill .dot{width:6px;height:6px;border-radius:50%;flex:none}
.pill.on{color:var(--green);border-color:var(--green-deep);background:rgb(127 208 105 / 10%)}
.pill.on .dot{background:var(--green)}
.pill.off{color:var(--red);border-color:var(--red-deep);background:rgb(232 106 94 / 10%)}
.pill.off .dot{background:var(--red)}
.pill.never{color:var(--dim);border-color:var(--line);border-style:dashed;background:transparent}
.pill.never .dot{background:var(--dim-2)}
.state-detail{font-size:11.5px;color:var(--dim-2);margin-top:3px;font-family:var(--mono)}

.tag{
  display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:5px;
  font-size:11.5px;border:1px solid var(--line);color:var(--dim);background:var(--roast-2);
  white-space:nowrap;
}
.tag.kill{color:var(--red);border-color:var(--red-deep)}
.tag.risk-high{color:var(--gold-hot);border-color:var(--gold-deep)}
.tag.unclassified{border-style:dashed;color:var(--dim-2)}

/* the switch — three states, because Golden has three */
.sw{
  width:38px;height:21px;border-radius:999px;position:relative;flex:none;
  border:1px solid var(--line);background:var(--roast-2);transition:background var(--t),border-color var(--t);
}
.sw::after{
  content:"";position:absolute;top:2px;left:2px;width:15px;height:15px;border-radius:50%;
  background:var(--dim-2);transition:transform var(--t),background var(--t);
}
.sw:hover{border-color:var(--dim-2)}
.sw.on{background:var(--green-deep);border-color:var(--green)}
.sw.on::after{transform:translateX(17px);background:var(--green)}
.sw.off{background:rgb(232 106 94 / 14%);border-color:var(--red-deep)}
.sw.off::after{background:var(--red)}
.sw.never{border-style:dashed;background:transparent}
.sw.never::after{background:transparent;border:1.5px dashed var(--dim-2);width:15px;height:15px}

.kebab{
  width:28px;height:28px;border-radius:6px;display:grid;place-items:center;color:var(--dim-2);
  transition:background var(--t),color var(--t);
}
.kebab:hover{background:var(--card-3);color:var(--crema)}

.menu{
  position:fixed;z-index:60;min-width:214px;padding:5px;
  background:var(--card-2);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow-hi);
}
.menu button{
  width:100%;display:flex;align-items:center;gap:9px;padding:7px 9px;border-radius:6px;
  font-size:13px;text-align:left;color:var(--crema);transition:background var(--t);
}
.menu button:hover{background:var(--card-3)}
.menu button.danger{color:var(--red)}
.menu hr{border:none;border-top:1px solid var(--line);margin:4px 0}

.empty{padding:44px 20px;text-align:center;color:var(--dim)}
.empty b{display:block;color:var(--crema);font-size:15px;margin-bottom:5px;font-weight:600}

/* ── modal ──────────────────────────────────────────────────────────────── */
.scrim{
  position:fixed;inset:0;z-index:70;background:rgb(8 6 4 / 66%);
  display:flex;align-items:flex-start;justify-content:center;padding:44px 20px;overflow-y:auto;
  animation:fade 120ms ease-out;
}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{
  width:100%;max-width:720px;background:var(--card);border:1px solid var(--line);
  border-radius:var(--r-lg);box-shadow:var(--shadow-hi);overflow:hidden;
  animation:rise 140ms cubic-bezier(.2,0,.2,1);
}
.modal.wide{max-width:900px}
.modal.narrow{max-width:460px}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.modal-head{display:flex;align-items:flex-start;gap:12px;padding:18px 20px 14px}
.modal-head h2{font-size:16px;font-weight:600;display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.modal-head h2 .k{font-family:var(--mono);font-size:15px}
.modal-head .sub{color:var(--dim);font-size:12.5px;margin-top:4px}
.x{
  margin-left:auto;width:28px;height:28px;border-radius:6px;display:grid;place-items:center;
  color:var(--dim-2);flex:none;transition:background var(--t),color var(--t);
}
.x:hover{background:var(--card-3);color:var(--crema)}
.modal-tabs{display:flex;gap:2px;padding:0 20px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.modal-tabs::-webkit-scrollbar{display:none}
.modal-tab{
  padding:9px 11px;font-size:13px;color:var(--dim);white-space:nowrap;
  border-bottom:2px solid transparent;transition:color var(--t),border-color var(--t);
}
.modal-tab:hover{color:var(--crema)}
.modal-tab[aria-selected="true"]{color:var(--crema);border-bottom-color:var(--gold);font-weight:500}
.modal-body{padding:20px}
.modal-foot{
  display:flex;align-items:center;gap:9px;padding:14px 20px;border-top:1px solid var(--line);
  background:var(--roast-2);
}
.modal-foot .note{font-size:12px;color:var(--dim-2);margin-right:auto;max-width:40ch}

.field{margin-bottom:20px}
.field:last-child{margin-bottom:0}
.field>.lab{
  font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--dim-2);
  font-weight:600;display:block;margin-bottom:8px;
}
.field .hint{font-size:12.5px;color:var(--dim);margin-top:7px;max-width:64ch}

.seg{display:inline-flex;padding:3px;background:var(--roast-2);border:1px solid var(--line);border-radius:9px;gap:3px}
.seg button{
  padding:7px 16px;border-radius:7px;font-size:13.5px;font-weight:600;color:var(--dim);
  transition:background var(--t),color var(--t);
}
.seg button:hover{color:var(--crema)}
.seg button[aria-pressed="true"]{background:var(--card-3);color:var(--crema)}
.seg button.yes[aria-pressed="true"]{background:var(--green-deep);color:var(--green)}
.seg button.no[aria-pressed="true"]{background:rgb(232 106 94 / 18%);color:var(--red)}

.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{
  padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--roast-2);
  font-size:12.5px;color:var(--dim);transition:all var(--t);
}
.chip:hover{border-color:var(--dim-2);color:var(--crema)}
.chip[aria-pressed="true"]{border-color:var(--gold);background:rgb(232 185 60 / 12%);color:var(--gold-hot);font-weight:600}

.picklist{display:flex;flex-direction:column;gap:6px}
.pick{
  display:flex;align-items:center;gap:11px;padding:11px 13px;border-radius:var(--r);
  border:1px solid var(--line);background:var(--roast-2);text-align:left;width:100%;
  transition:border-color var(--t),background var(--t);
}
.pick:hover{border-color:var(--dim-2)}
.pick[aria-pressed="true"]{border-color:var(--gold);background:rgb(232 185 60 / 8%)}
.pick .radio{
  width:15px;height:15px;border-radius:50%;border:1.5px solid var(--dim-2);flex:none;
  display:grid;place-items:center;transition:border-color var(--t);
}
.pick[aria-pressed="true"] .radio{border-color:var(--gold)}
.pick[aria-pressed="true"] .radio::after{content:"";width:7px;height:7px;border-radius:50%;background:var(--gold)}
.pick .t{display:block;font-size:13.5px;font-weight:500}
.pick .t .mono{font-size:13px}
.pick .d{display:block;font-size:12px;color:var(--dim-2);margin-top:2px;line-height:1.45}
.pick .badge{
  margin-left:auto;font-size:11px;padding:2px 8px;border-radius:999px;
  border:1px solid var(--gold-deep);color:var(--gold);white-space:nowrap;
}

.envtable{width:100%;border-collapse:collapse;font-size:13.5px}
.envtable th{
  text-align:left;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim-2);
  font-weight:600;padding:0 12px 8px 0;border-bottom:1px solid var(--line);
}
.envtable td{padding:12px 12px 12px 0;border-bottom:1px solid var(--line-soft);vertical-align:top}
.envtable tr:last-child td{border-bottom:none}
.envtable .who{font-size:12px;color:var(--dim-2);margin-top:3px}
.envtable td:last-child{padding-right:0;text-align:right}
.envname{display:flex;align-items:center;gap:8px;font-weight:600}
.here{font-size:10.5px;color:var(--gold);border:1px solid var(--gold-deep);border-radius:999px;padding:1px 7px;font-weight:600}

.timeline{display:flex;flex-direction:column;gap:0}
.tl{display:flex;gap:13px;padding:0 0 18px;position:relative}
.tl:last-child{padding-bottom:0}
.tl::before{
  content:"";position:absolute;left:6px;top:16px;bottom:0;width:1px;background:var(--line);
}
.tl:last-child::before{display:none}
.tl .dot{
  width:13px;height:13px;border-radius:50%;flex:none;margin-top:3px;z-index:1;
  border:2px solid var(--roast);background:var(--dim-2);
}
.tl.on .dot{background:var(--green)}
.tl.off .dot{background:var(--red)}
.tl.ver .dot{background:var(--blue)}
.tl .t{font-size:13.5px}
.tl .t b{font-weight:600}
.tl .m{font-size:12px;color:var(--dim-2);margin-top:3px;font-family:var(--mono)}
.tl .reason{
  display:inline-block;margin-top:6px;font-size:12px;color:var(--dim);
  border-left:2px solid var(--line);padding-left:9px;
}

.bars{display:flex;align-items:flex-end;gap:3px;height:88px;margin-top:6px}
.bars i{flex:1;background:linear-gradient(180deg,var(--gold),var(--gold-deep));border-radius:2px 2px 0 0;min-height:2px}
.bars i.dim{background:var(--card-3)}
.barscale{display:flex;justify-content:space-between;font-family:var(--mono);font-size:11px;color:var(--dim-2);margin-top:6px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:18px}
.kpi{padding:12px 14px;border-radius:var(--r);background:var(--roast-2);border:1px solid var(--line)}
.kpi .n{font-family:var(--mono);font-size:19px;font-weight:600;font-variant-numeric:tabular-nums}
.kpi .k{font-size:11.5px;color:var(--dim-2);margin-top:2px}

.inline-edit{
  display:flex;align-items:flex-start;gap:10px;padding:11px 13px;border-radius:var(--r);
  background:var(--roast-2);border:1px solid var(--line);
}
.inline-edit .val{flex:1;font-size:13.5px;line-height:1.55}
.inline-edit input{
  flex:1;background:var(--card);border:1px solid var(--gold-deep);border-radius:6px;
  padding:7px 10px;color:var(--crema);font:inherit;font-size:13.5px;
}
.inline-edit input:focus{outline:none;border-color:var(--gold)}
.note-box{
  padding:11px 13px;border-radius:var(--r);background:var(--roast-2);border:1px dashed var(--line);
  font-size:12.5px;color:var(--dim-2);line-height:1.55;
}
.note-box .lab2{
  display:block;font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;
  color:var(--dim-2);font-weight:600;margin-bottom:6px;
}

.rule{
  display:flex;flex-wrap:wrap;align-items:center;gap:7px;padding:11px;border-radius:var(--r);
  background:var(--roast-2);border:1px solid var(--line);margin-bottom:8px;
}
.rule .as{font-size:12.5px;color:var(--dim-2);padding:0 2px}
.rule .sel select{padding:6px 26px 6px 9px;font-size:13px}
.rule .rm{margin-left:auto;color:var(--dim-2);padding:4px 6px;border-radius:5px}
.rule .rm:hover{color:var(--red);background:var(--card-3)}
.slider{display:flex;align-items:center;gap:13px}
.slider input[type=range]{flex:1;accent-color:var(--gold);height:4px}
.slider .v{font-family:var(--mono);font-size:15px;font-weight:600;width:52px;text-align:right;color:var(--gold-hot)}

.callout{
  display:flex;gap:11px;padding:13px 15px;border-radius:var(--r);font-size:13px;line-height:1.55;
  background:rgb(232 106 94 / 8%);border:1px solid var(--red-deep);color:var(--crema);
}
.callout.info{background:rgb(109 179 232 / 7%);border-color:#2f4d63}
.callout .ico{flex:none;color:var(--red);margin-top:1px}
.callout.info .ico{color:var(--blue)}
.callout b{font-weight:600}

/* compare matrix */
.matrix{width:100%;border-collapse:collapse;font-size:13px}
.matrix th{
  position:sticky;top:0;background:var(--roast-2);z-index:2;
  text-align:left;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim-2);
  font-weight:600;padding:10px 12px;border-bottom:1px solid var(--line);
}
.matrix th.env{text-align:center;width:132px}
.matrix td{padding:9px 12px;border-bottom:1px solid var(--line-soft)}
.matrix td.c{text-align:center}
.matrix tbody tr:hover{background:var(--card-2)}
.matrix .key{font-family:var(--mono);font-size:13px}
.cell{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:6px}
.cell.on{background:rgb(127 208 105 / 16%);color:var(--green)}
.cell.off{background:rgb(232 106 94 / 16%);color:var(--red)}
.cell.never{color:var(--dim-2);border:1px dashed var(--line)}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--dim);margin-bottom:14px}
.legend span{display:inline-flex;align-items:center;gap:7px}

/* wizard */
.steps{display:flex;gap:0;margin-bottom:22px}
.step{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--dim-2);flex:1}
.step .n{
  width:21px;height:21px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;
  font-family:var(--mono);font-size:11px;flex:none;
}
.step[data-on="true"]{color:var(--crema)}
.step[data-on="true"] .n{border-color:var(--gold);color:var(--gold);background:rgb(232 185 60 / 10%)}
.step[data-done="true"] .n{background:var(--gold);border-color:var(--gold);color:#241d14}
.step .line{flex:1;height:1px;background:var(--line);margin:0 4px}
.step:last-child .line{display:none}
.keyfield{display:flex;align-items:center;gap:0;border:1px solid var(--line);border-radius:var(--r);background:var(--roast-2);overflow:hidden}
.keyfield .sel select{border:none;border-right:1px solid var(--line);border-radius:0;background:var(--card-2);font-family:var(--mono)}
.keyfield input{
  flex:1;background:transparent;border:none;padding:9px 11px;color:var(--crema);
  font-family:var(--mono);font-size:13.5px;
}
.keyfield input:focus{outline:none}
.keyfield .suffix{padding:0 12px;font-family:var(--mono);font-size:13.5px;color:var(--dim-2)}
.cardpick{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.cardpick .pick{flex-direction:column;align-items:flex-start;gap:5px;padding:13px}
.cardpick .pick .radio{display:none}
.review{display:flex;flex-direction:column;gap:0;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.review div{display:flex;gap:12px;padding:10px 13px;border-bottom:1px solid var(--line-soft);font-size:13.5px}
.review div:last-child{border-bottom:none}
.review .k{width:112px;flex:none;color:var(--dim-2);font-size:12.5px}

.placeholder{
  padding:40px 30px;border-radius:var(--r-lg);border:1px dashed var(--line);background:var(--card);
  text-align:center;
}
.placeholder h3{font-size:17px;font-weight:600;margin-bottom:7px}
.placeholder p{color:var(--dim);font-size:13.5px;max-width:56ch;margin:0 auto}

.toast{
  position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:90;
  display:flex;align-items:center;gap:10px;padding:11px 17px;border-radius:999px;
  background:var(--card-2);border:1px solid var(--line);box-shadow:var(--shadow-hi);
  font-size:13.5px;animation:rise 140ms cubic-bezier(.2,0,.2,1);
}
.toast .dot{width:7px;height:7px;border-radius:50%;background:var(--green);flex:none}
.toast button{color:var(--gold);font-weight:600;font-size:13px}

.diff{display:grid;grid-template-columns:1fr 1fr;gap:0;border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden}
.diff>div{padding:16px 18px}
.diff>div:first-child{border-right:1px solid var(--line);background:rgb(232 106 94 / 5%)}
.diff h4{
  font-size:11px;letter-spacing:.09em;text-transform:uppercase;font-weight:600;margin-bottom:11px;
}
.diff>div:first-child h4{color:var(--red)}
.diff>div:last-child h4{color:var(--green)}
.diff li{font-size:13px;padding:5px 0;border-bottom:1px solid var(--line-soft);color:var(--dim)}
.diff li:last-child{border-bottom:none}
.diff li b{color:var(--crema);font-weight:500}
.diff li .mono{font-size:12.5px}
.wordlist{display:flex;flex-direction:column;gap:0;margin-top:16px}
.wordlist div{display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid var(--line-soft);font-size:13px}
.wordlist div:last-child{border-bottom:none}
.wordlist .was{flex:1;color:var(--dim-2);text-decoration:line-through;text-decoration-color:var(--red-deep)}
.wordlist .arw{color:var(--dim-2)}
.wordlist .now{flex:1;color:var(--crema);font-weight:500}

@media (max-width:900px){
  .frame{grid-template-columns:1fr}
  .rail{position:static;height:auto;border-right:none;border-bottom:1px solid var(--line)}
  .content{padding:20px 16px 70px}
  .listhead{display:none}
  .row{flex-wrap:wrap}
  .row-main{flex:1 1 100%}
  .row-state,.row-meta{width:auto}
  .row-act{width:auto;margin-left:auto}
  .diff{grid-template-columns:1fr}
  .diff>div:first-child{border-right:none;border-bottom:1px solid var(--line)}
}

/* ═══════════════════════════════════════════════════════════════════════════
   MEASURE — the chart vocabulary. Hand-rolled SVG on the token set (epic D7):
   no dependency, no bundle cost, no second theming system.

   The colour rules below were COMPUTED, not chosen (dataviz validator, dark,
   surface --roast-2):
     · magnitude  → --gold alone, light→dark. Never a rainbow.
     · 2-way identity → --gold + --blue. CVD ΔE 23.4 (protan) / 23.2 (tritan),
       normal-vision 25.3. Safe.
     · status → --green / --red, ALWAYS with a word and a shape. Never colour
       alone. deutan ΔE 9.9 is above the floor but only just, and red/green is
       the classic CVD pair — the same rule the state pill already follows.
     · NEVER four categorical hues. The brand's four accents fail as a 4-way
       set. Beyond two series → small multiples, or fold into "Other".
     · NEVER a dual axis. The North Star and its inputs are different scales,
       so they are small multiples, not two lines on one plot.
   ═══════════════════════════════════════════════════════════════════════════ */

/* the hero number — one metric, stated once, at the top of its own page */
.hero{display:flex;align-items:flex-end;gap:18px;margin-bottom:4px}
.hero .n{
  font-family:var(--mono);font-size:44px;font-weight:600;line-height:1;
  font-variant-numeric:tabular-nums;letter-spacing:-.02em;
}
.hero .delta{display:flex;align-items:center;gap:6px;font-size:13.5px;padding-bottom:5px}
.hero .delta.up{color:var(--green)}
.hero .delta.down{color:var(--red)}
.hero .delta .arw{font-family:var(--mono);font-size:12px}
.hero-sub{font-size:12.5px;color:var(--dim-2);margin-bottom:18px}

/* plot frame */
.plot{position:relative;margin-top:4px}
.plot svg{display:block;width:100%;height:auto;overflow:visible}
.plot .grid{stroke:var(--line-soft);stroke-width:1}
.plot .axis{font-family:var(--mono);font-size:10.5px;fill:var(--dim-2)}
.plot .line{fill:none;stroke:var(--gold);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.plot .area{fill:url(#goldfade)}
.plot .endpt{fill:var(--gold-hot);stroke:var(--roast);stroke-width:2}
.plot .target{stroke:var(--dim-2);stroke-width:1;stroke-dasharray:3 3;fill:none}
.plot .hit{fill:transparent;cursor:crosshair}
.plot .cross{stroke:var(--dim-2);stroke-width:1;pointer-events:none}
.tip{
  position:absolute;pointer-events:none;background:var(--card-2);border:1px solid var(--line);
  border-radius:var(--r);padding:7px 10px;font-size:12px;box-shadow:var(--shadow);
  white-space:nowrap;transform:translate(-50%,-118%);z-index:5;
}
.tip b{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:12.5px}
.tip .w{display:block;color:var(--dim-2);font-size:11px;margin-top:1px}

/* small multiples — the ONLY honest way to show inputs on different scales */
.smalls{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.small{padding:13px 15px 11px;border-radius:var(--r);background:var(--roast-2);border:1px solid var(--line)}
.small .k{font-size:11.5px;color:var(--dim-2);margin-bottom:6px;line-height:1.35}
.small .v{display:flex;align-items:baseline;gap:8px}
.small .v b{font-family:var(--mono);font-size:20px;font-weight:600;font-variant-numeric:tabular-nums}
.small .v span{font-size:12px}
.small .v span.up{color:var(--green)} .small .v span.down{color:var(--red)}
.small .spark{margin-top:8px;height:30px}
.small .spark svg{display:block;width:100%;height:30px}
.small .spark path{fill:none;stroke:var(--gold);stroke-width:1.5;stroke-linejoin:round}
.small .stale{margin-top:7px;font-size:11px;color:var(--dim-2);font-family:var(--mono)}

/* the stage funnel — sequential, one hue, light→dark by position */
.hbars{display:flex;flex-direction:column;gap:11px}
.hbar .t{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:5px}
.hbar .t .nm{font-size:13.5px}
.hbar .t .nm .stagenum{
  font-family:var(--mono);font-size:11px;color:var(--dim-2);margin-right:8px;
}
.hbar .t .num{font-family:var(--mono);font-size:13px;font-variant-numeric:tabular-nums;color:var(--dim)}
.hbar .track{height:26px;border-radius:5px;background:var(--roast-2);overflow:hidden;position:relative}
.hbar .fill{height:100%;border-radius:5px 3px 3px 5px;transition:width var(--t)}
.hbar .drop{
  margin-top:5px;font-size:11.5px;color:var(--dim-2);display:flex;align-items:center;gap:6px;
}
.hbar .drop .arw{font-family:var(--mono);color:var(--red)}

/* success / failure — status colours, never alone: each half carries its word */
.splitbar{display:flex;height:22px;border-radius:5px;overflow:hidden;gap:2px;background:var(--roast-2)}
.splitbar i{display:block;height:100%}
.splitbar i.ok{background:var(--green-deep);border-bottom:2px solid var(--green)}
.splitbar i.bad{background:var(--red-deep);border-bottom:2px solid var(--red)}
.splitkey{display:flex;gap:16px;margin-top:7px;font-size:12px;color:var(--dim)}
.splitkey span{display:flex;align-items:center;gap:6px}
.splitkey i{width:9px;height:9px;border-radius:2px;flex:none}
.splitkey i.ok{background:var(--green)} .splitkey i.bad{background:var(--red)}
.splitkey b{font-family:var(--mono);font-variant-numeric:tabular-nums;font-weight:500}

/* the two-way identity tag — gold / blue, the only validated pair */
.kind{
  display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;
  padding:3px 9px;border-radius:999px;border:1px solid;line-height:1.5;
}
.kind::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.kind.resilience{color:var(--gold);border-color:var(--gold-deep);background:rgb(232 185 60 / 8%)}
.kind.security{color:var(--blue);border-color:#2f5570;background:rgb(109 179 232 / 9%)}

/* breadcrumb back to the thing a page is a view OF */
.crumbrow{display:flex;align-items:center;gap:9px;font-size:12.5px;color:var(--dim-2);margin-bottom:14px}
.crumbrow button{color:var(--gold);font-size:12.5px}
.crumbrow button:hover{color:var(--gold-hot)}
.crumbrow .sep{color:var(--line)}

/* version list — the same shape the flag versions already use */
.vers{display:flex;flex-direction:column;gap:1px;background:var(--line-soft);border-radius:var(--r);overflow:hidden}
.vers .v{display:flex;align-items:center;gap:12px;padding:12px 15px;background:var(--roast-2);font-size:13px}
.vers .v .n{font-family:var(--mono);font-weight:500;width:34px;flex:none;color:var(--dim)}
.vers .v .who{color:var(--dim-2);font-size:12px;margin-left:auto;font-family:var(--mono)}

@media (max-width:900px){
  .smalls{grid-template-columns:1fr}
  .hero .n{font-size:34px}
}

/* `.hint` was only styled inside `.field`. These screens use it as a page-level
   footnote too, so it gets a scope-free rule rather than a wrapper div. */
.hint{font-size:12.5px;color:var(--dim);margin-top:7px;max-width:64ch}

/* A row-level "nothing yet" line. `.empty` is the centred full-card state and
   reads as a broken column when it sits inside a row. */
.neverrun{font-size:12.5px;color:var(--dim-2);padding:4px 0 2px}
.neverrun b{color:var(--dim);font-weight:600}

/* A stale input is marked with a dot, not a warning glyph — the drift guard bans
   pictographs inside /app, and "colour plus a shape" is the rule this design
   already follows on every state pill. */
.small .stale{display:flex;align-items:center;gap:6px}
.warnpip{width:6px;height:6px;border-radius:50%;background:var(--gold-hot);flex:none}

/* ═══════════════════════════════════════════════════════════════════════════
   BATCH 2 — Ship & Setup completion, and Tasks folded into Today.
   ═══════════════════════════════════════════════════════════════════════════ */

/* ── the band: Today's organising device ──────────────────────────────────
   Today is one question — "who is this waiting on?" — asked three times.
   The band is what makes that readable, and it is the SAME summary-and-expand
   interaction already approved on the dormant feature group. Not a new
   pattern; the approved one, used a second time. */
.band{margin-bottom:26px}
.band > h3{
  display:flex;align-items:baseline;gap:10px;font-size:15px;font-weight:600;
  margin-bottom:4px;
}
.band > h3 .who{
  font:500 10.5px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;
  padding:4px 8px;border-radius:999px;border:1px solid;
}
.band > h3 .who.you{color:var(--gold);border-color:var(--gold-deep);background:rgb(232 185 60 / 8%)}
.band > h3 .who.agent{color:var(--blue);border-color:#2f5570;background:rgb(109 179 232 / 9%)}
.band > h3 .who.done{color:var(--dim-2);border-color:var(--line);background:var(--card)}
.band > .sub{font-size:13px;color:var(--dim-2);margin-bottom:12px;max-width:70ch}

/* a task row — the same row grammar as a feature row, one line of meaning each */
.task{
  display:flex;align-items:flex-start;gap:14px;padding:14px 16px;
  border-bottom:1px solid var(--line-soft);
}
.task:last-child{border-bottom:none}
.task .sig{
  width:7px;height:7px;border-radius:50%;flex:none;margin-top:7px;
}
.task .sig.error{background:var(--red)}
.task .sig.friction{background:var(--gold)}
.task .b{flex:1;min-width:0}
.task .t{font-size:13.5px;font-weight:500;line-height:1.4}
.task .m{font-size:12px;color:var(--dim-2);margin-top:3px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.task .m .sep{color:var(--line)}
.task .m .mono{font-size:11.5px}
.task .act{flex:none;display:flex;gap:7px;align-items:center}
.task .by{
  flex:none;font-size:11.5px;color:var(--dim-2);font-family:var(--mono);
  width:150px;text-align:right;
}
.task .by b{display:block;color:var(--blue);font-weight:500}
.task .by b.human{color:var(--gold)}

/* the agent's own line — the product's whole pitch, stated where it is true */
.agentline{
  display:flex;align-items:center;gap:11px;padding:11px 15px;
  border-radius:var(--r);background:rgb(109 179 232 / 6%);border:1px solid #2f5570;
  font-size:13px;margin-bottom:12px;
}
.agentline .pulse{
  width:8px;height:8px;border-radius:50%;background:var(--blue);flex:none;
  box-shadow:0 0 0 0 rgb(109 179 232 / 55%);animation:pulse 2.4s infinite;
}
@keyframes pulse{
  70%{box-shadow:0 0 0 7px rgb(109 179 232 / 0%)}
  100%{box-shadow:0 0 0 0 rgb(109 179 232 / 0%)}
}
.agentline b{font-weight:600}
.agentline .when{margin-left:auto;color:var(--dim-2);font-size:11.5px;font-family:var(--mono)}

/* variant comparison — control vs treatment. gold + blue is the ONLY validated
   two-way pair in this palette (CVD ΔE 23.4); a third variant is a third row,
   never a third hue. */
.vbars{display:flex;flex-direction:column;gap:16px}
.vbar .t{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px;gap:12px}
.vbar .t .nm{font-size:13.5px;display:flex;align-items:center;gap:8px}
.vbar .t .nm i{width:9px;height:9px;border-radius:2px;flex:none}
.vbar .t .nm i.control{background:var(--dim-2)}
.vbar .t .nm i.treatment{background:var(--blue)}
.vbar .t .num{font-family:var(--mono);font-size:13px;font-variant-numeric:tabular-nums}
.vbar .track{height:24px;border-radius:5px;background:var(--roast-2);overflow:hidden}
.vbar .fill{height:100%;border-radius:5px}
.vbar .fill.control{background:linear-gradient(90deg,#6b6151,#4a4335)}
.vbar .fill.treatment{background:linear-gradient(90deg,var(--blue),#3d6f96)}
.vbar .foot{margin-top:5px;font-size:11.5px;color:var(--dim-2)}

/* a confidence interval, drawn — a number ± a number is not a range you can see */
.ci{margin-top:4px;height:26px;position:relative}
.ci .axis0{position:absolute;top:0;bottom:0;width:1px;background:var(--dim-2)}
.ci .rng{position:absolute;top:9px;height:8px;border-radius:4px;background:rgb(109 179 232 / 35%);border:1px solid var(--blue)}
.ci .pt{position:absolute;top:8px;width:10px;height:10px;border-radius:50%;background:var(--blue);border:2px solid var(--roast-2);margin-left:-5px}
.cikey{display:flex;justify-content:space-between;font-family:var(--mono);font-size:10.5px;color:var(--dim-2);margin-top:3px}

/* blockers — why you cannot decide yet, named one per line */
.blockers{display:flex;flex-direction:column;gap:8px;margin-top:4px}
.blocker{display:flex;gap:10px;align-items:flex-start;font-size:13px;color:var(--dim)}
/* WARNING — NOT `.x` — the prototype already owns `.x` as the modal's absolutely-positioned
   close button, and a bare `.blocker .x` inherits its `position:absolute` and flies
   to the corner. Same class-collision family as the landing rules leaking into the
   console through `.tag` and `.note`; the fix is a name of its own, not a patch. */
.blocker .no{
  position:static;color:var(--red);font-family:var(--mono);flex:none;line-height:1.5;
  width:auto;height:auto;background:none;border:none;
}
.blocker b{color:var(--crema);font-weight:600}

/* the decision — five named outcomes, from the contract, not invented */
.outcomes{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.outcome{
  padding:9px 14px;border-radius:var(--r);border:1px solid var(--line);
  background:var(--card);font-size:13px;transition:all var(--t);
}
.outcome:hover:not([disabled]){border-color:var(--gold-deep);color:var(--crema);background:var(--card-2)}
.outcome[disabled]{opacity:.4;cursor:not-allowed}
.outcome.primary{border-color:var(--gold-deep);color:var(--gold)}

/* delivery health — reuses the drill split bar exactly */
.health{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--dim-2)}
.health .splitbar{width:120px;flex:none}

@media (max-width:900px){
  .task{flex-wrap:wrap}
  .task .by{width:auto;text-align:left;margin-left:21px}
}

.seeall{font-size:13px;color:var(--gold);padding:0;border-bottom:1px solid rgb(232 185 60 / 30%)}
.seeall:hover{color:var(--gold-hot);border-bottom-color:var(--gold-hot)}

/* A nonzero failure that rounds to zero pixels reads as "nothing failed" — which
   is the opposite of true. 3 of 1,843 is 0.16% and would draw at under a pixel.
   The count beside it is the precise number; the bar's job is only to say that a
   failure exists at all. (dataviz: bars carry a minimum mark size.) */
.splitbar i.bad{min-width:4px}

/* ═══════════════════════════════════════════════════════════════════════════
   BATCH 3 — the Roadmap hub.

   ── Where the hub sits, and why it is not a fifth section ─────────────────
   The console answers "how is the PRODUCT doing?" — Today, Measure, Ship,
   Setup are one loop about one object, a feature. The hub answers "how is the
   WORK doing?" — idea → seed → epic → sprint → shipped. Two loops, two
   audiences, the same project.

   So the hub is a PEER VIEW of the project, not a fifth destination:
     · Four destinations survives (the thing the last epic is named for).
     · The switch lives in the PROJECT SWITCHER menu — the project-scope
       control — so tier 1 stays "switcher · ⌘K · account, nothing else"
       (CONSOLE-CONTRACT tier-1 rule, unbroken).
     · ⌘K reaches every hub surface, because the epic's own outcome test is
       "every surface in three clicks or one ⌘K" and the hub is a surface.
     · Going back is the SAME menu. Symmetry, not a special back button.
   ═══════════════════════════════════════════════════════════════════════════ */

.menu-div{height:1px;background:var(--line);margin:6px 0}
.menu-lab{
  display:block;padding:6px 12px 4px;font:600 10px/1 var(--mono);
  letter-spacing:.13em;text-transform:uppercase;color:var(--dim-2);
}

/* ── the build-order track ────────────────────────────────────────────────
   27 epics in one sequence. Twenty-seven nodes side by side is a barcode, so
   the SHAPE is a progress track (where are we in the sequence) and the NAMES
   live in the list beneath it. One hue, light→dark by state — a sequence is
   magnitude, not identity. */
.track{display:flex;gap:2px;height:34px;margin:4px 0 10px}
.track i{flex:1;border-radius:2px;position:relative;min-width:3px}
.track i.shipped{background:var(--gold-deep)}
.track i.shipped.recent{background:var(--gold)}
.track i.building{background:var(--gold-hot);box-shadow:0 0 0 0 rgb(255 212 94 / 55%);animation:pulse 2.4s infinite}
.track i.queued{background:var(--card-3);border:1px dashed var(--line)}
.trackkey{display:flex;gap:18px;font-size:12px;color:var(--dim-2);margin-bottom:2px;flex-wrap:wrap}
.trackkey span{display:flex;align-items:center;gap:7px}
.trackkey i{width:10px;height:10px;border-radius:2px;flex:none}
.trackkey i.shipped{background:var(--gold-deep)}
.trackkey i.building{background:var(--gold-hot)}
.trackkey i.queued{background:var(--card-3);border:1px dashed var(--line)}
.trackkey b{color:var(--dim);font-family:var(--mono);font-weight:500}

/* an epic row — the same row grammar as a feature row */
.epic{display:flex;align-items:center;gap:14px;padding:13px 16px;border-bottom:1px solid var(--line-soft);cursor:pointer}
.epic:last-child{border-bottom:none}
.epic:hover{background:var(--card)}
.epic .ord{
  font-family:var(--mono);font-size:12px;color:var(--dim-2);width:30px;flex:none;
  font-variant-numeric:tabular-nums;text-align:right;
}
.epic .nm{flex:1;min-width:0}
.epic .nm b{display:block;font-size:13.5px;font-weight:500;line-height:1.4}
.epic .nm span{display:block;font-size:12px;color:var(--dim-2);margin-top:2px}
.epic .prog{width:120px;flex:none;font-family:var(--mono);font-size:12px;color:var(--dim);text-align:right}
.epic .st{width:132px;flex:none;display:flex;justify-content:flex-end}

/* sprint rows inside an epic */
.sprints{display:flex;flex-direction:column;gap:1px;background:var(--line-soft);border-radius:var(--r);overflow:hidden}
.sprintrow{display:flex;align-items:center;gap:14px;padding:13px 16px;background:var(--roast-2);font-size:13.5px}
.sprintrow .n{font-family:var(--mono);color:var(--dim-2);width:26px;flex:none}
.sprintrow .nm{flex:1;min-width:0}
.sprintrow .bar{width:104px;flex:none;height:6px;border-radius:3px;background:var(--roast);overflow:hidden}
.sprintrow .bar i{display:block;height:100%;background:var(--gold);border-radius:3px}
.sprintrow .cnt{width:74px;flex:none;font-family:var(--mono);font-size:12px;color:var(--dim);text-align:right}

/* ── horizon: destinations you light up ───────────────────────────────────
   lit / partly lit / on the way is a SEQUENCE (how lit), not three identities
   — so it is one hue at three strengths, never three hues. */
.dests{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px}
.dest{
  padding:18px 20px 20px;border-radius:var(--r-lg);background:var(--roast-2);
  border:1px solid var(--line);display:flex;flex-direction:column;gap:9px;
}
.dest[data-status="lit"]{border-color:var(--gold);background:linear-gradient(180deg,rgb(232 185 60 / 7%),transparent 55%),var(--roast-2)}
.dest[data-status="partial"]{border-color:var(--gold-deep)}
.dest[data-status="coming"]{border-style:dashed}
.dest .h{display:flex;align-items:flex-start;gap:10px}
.dest .h h4{flex:1;font-size:15px;font-weight:600;margin:0;line-height:1.3}
.dest .lamp{
  width:26px;height:26px;border-radius:50%;flex:none;display:grid;place-items:center;
  font-family:var(--mono);font-size:11px;border:1px solid;
}
.dest[data-status="lit"] .lamp{color:var(--roast);background:var(--gold-hot);border-color:var(--gold-hot)}
.dest[data-status="partial"] .lamp{color:var(--gold);background:rgb(232 185 60 / 15%);border-color:var(--gold-deep)}
.dest[data-status="coming"] .lamp{color:var(--dim-2);background:none;border-color:var(--line);border-style:dashed}
.dest .why{font-size:13px;color:var(--dim);line-height:1.5}
.dest .lights{display:flex;flex-direction:column;gap:5px;margin-top:2px}
.dest .lights li{font-size:12.5px;color:var(--dim-2);display:flex;gap:8px;align-items:baseline}
.dest .lights li .tick{flex:none;display:inline-flex;align-items:center}
.dest .lights li.on{color:var(--dim)}
.dest .lights li.on .tick{color:var(--green)}
.dest .lights li.off .tick{color:var(--dim-2)}
.dest .none{font-size:12.5px;color:var(--dim-2);font-style:italic}

/* the haze — ideas not yet on the road. Literally hazier. */
.haze{margin-top:30px;padding-top:22px;border-top:1px dashed var(--line);opacity:.82}
.haze h3{font-size:15px;font-weight:600;margin-bottom:4px}
.haze > p{font-size:13px;color:var(--dim-2);margin-bottom:14px;max-width:66ch}
.hazelist{display:flex;flex-wrap:wrap;gap:8px}
.hazeitem{
  padding:8px 13px;border-radius:999px;border:1px dashed var(--line);
  background:var(--roast-2);font-size:12.5px;color:var(--dim-2);
}

/* ── the report: a generated document, with its provenance on it ─────────── */
.doc{max-width:70ch}
.doc h2{font-size:17px;font-weight:600;margin:26px 0 8px;letter-spacing:-.01em}
.doc h2:first-child{margin-top:0}
.doc p{font-size:14px;color:var(--dim);line-height:1.68;margin-bottom:11px}
.doc p strong{color:var(--crema);font-weight:600}
.doc ul{display:flex;flex-direction:column;gap:7px;margin:10px 0 14px}
.doc ul li{font-size:13.5px;color:var(--dim);padding-left:17px;position:relative;line-height:1.55}
.doc ul li::before{content:"—";position:absolute;left:0;color:var(--gold-deep);font-family:var(--mono);font-size:12px}
.prov{
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:11px 15px;border-radius:var(--r);
  background:var(--roast-2);border:1px solid var(--line);font-size:12.5px;color:var(--dim-2);margin-bottom:22px;
}
.prov b{color:var(--dim);font-weight:500;font-family:var(--mono)}
.prov .sep{color:var(--line)}

@media (max-width:900px){
  .epic .prog,.epic .st{display:none}
  .dests{grid-template-columns:1fr}
}

/* the switcher's view rows carry the same aria-current cue as everything else */
.envmenu button[aria-current="true"]{background:var(--card-2);color:var(--crema)}
/* No glyph here either — a CSS `content` string is still a character in a file
   the guard reads. The cue is a dot, which is what every other aria-current in
   this design already uses. */
.envmenu button[aria-current="true"]::after{
  content:"";width:6px;height:6px;border-radius:50%;background:var(--gold);
  margin-left:8px;flex:none;
}

/* ═══════════════════════════════════════════════════════════════════════════
   BATCH 4 — the doors. The first screens anybody ever sees.

   ── The rule this batch establishes ──────────────────────────────────────
   CHROME APPEARS WHEN THERE IS SOMETHING TO NAVIGATE. Signed out there is no
   project, no environment and no sections, so the three-tier console chrome
   would be four rows of controls that do nothing. Three frames, one language:

     · DOOR frame     — one centred column, no nav at all (login, signup)
     · PUBLIC frame   — a slim bar: the mark, and at most one action
                        (install, a shared report, the 404, talk)
     · CONSOLE frame  — the three tiers, once you are inside

   Same tokens, same type, same buttons, same honest empty and error states in
   all three. Only the frame changes, and it changes for a reason you can say
   in one sentence.
   ═══════════════════════════════════════════════════════════════════════════ */

.doorlayer{position:fixed;inset:0;overflow-y:auto;background:var(--roast);z-index:40}

/* ── the door frame ──────────────────────────────────────────────────────── */
.door{min-height:100%;display:flex;flex-direction:column;align-items:center;
  justify-content:center;padding:56px 24px 80px}
.doorcard{width:100%;max-width:396px}
.doorbrand{display:flex;align-items:center;gap:11px;margin-bottom:30px}
.doorbrand .mark{width:32px;height:32px;border-radius:9px;font-size:12px}
.doorbrand b{font-size:15px;font-weight:600;letter-spacing:-.01em}
.doorcard h1{font-size:26px;font-weight:700;letter-spacing:-.02em;line-height:1.15;margin-bottom:7px}
.doorcard > p{font-size:13.5px;color:var(--dim);margin-bottom:24px;line-height:1.55}
.doorform{display:flex;flex-direction:column;gap:15px}
.doorform label{display:block;font-size:12.5px;color:var(--dim);margin-bottom:6px;font-weight:500}
.doorform input{
  width:100%;padding:11px 13px;border-radius:var(--r);border:1px solid var(--line);
  background:var(--roast-2);color:var(--crema);font:inherit;font-size:14px;
  transition:border-color var(--t),background var(--t);
}
.doorform input:focus{outline:none;border-color:var(--gold-deep);background:var(--card)}
.doorform input[aria-invalid="true"]{border-color:var(--red)}
.doorform .btn{width:100%;justify-content:center;height:42px}
.fielderr{display:flex;align-items:flex-start;gap:8px;margin-top:7px;font-size:12.5px;color:var(--red)}
.fielderr .pip{width:6px;height:6px;border-radius:50%;background:var(--red);flex:none;margin-top:5px}
.doorfoot{margin-top:22px;padding-top:18px;border-top:1px solid var(--line);
  font-size:13px;color:var(--dim-2);text-align:center}
.doorfoot a,.doorfoot button{color:var(--gold);font-size:13px}
.doornote{
  margin-top:16px;padding:12px 14px;border-radius:var(--r);background:var(--roast-2);
  border:1px solid var(--line);border-left:2px solid var(--gold);font-size:12.5px;color:var(--dim);
  line-height:1.55;
}
.doornote b{color:var(--crema);font-weight:600}

/* ── the public frame ────────────────────────────────────────────────────── */
.pubbar{
  display:flex;align-items:center;gap:12px;height:54px;padding:0 22px;
  border-bottom:1px solid var(--line);background:var(--roast-2);position:sticky;top:0;z-index:2;
}
.pubbar b{font-size:14px;font-weight:600}
.pubbar .sp{flex:1}
.pubwrap{max-width:820px;margin:0 auto;padding:42px 24px 90px}
.pubwrap.wide{max-width:1080px}
.pubwrap h1{font-size:30px;font-weight:700;letter-spacing:-.022em;line-height:1.14;margin-bottom:10px;text-wrap:balance}
.pubwrap > p.lede{font-size:15px;color:var(--dim);max-width:62ch;line-height:1.6;margin-bottom:26px}

/* the demo banner — /install serves the DEMO project's token, by design
   (AGENTS rule #2). The whole defect it caused was a signed-in operator
   following a link here and getting somebody else's data, so this page's job
   is to be UNMISTAKABLY the demo. */
.demobar{
  display:flex;align-items:flex-start;gap:11px;padding:13px 16px;border-radius:var(--r-lg);
  background:rgb(109 179 232 / 7%);border:1px solid #2f5570;font-size:13.5px;color:var(--dim);
  line-height:1.55;margin-bottom:24px;
}
.demobar .pip{width:8px;height:8px;border-radius:50%;background:var(--blue);flex:none;margin-top:6px}
.demobar b{color:var(--crema);font-weight:600}
.demobar .go{margin-left:auto;flex:none}

/* the 404 — one page for unknown, malformed, expired and revoked alike */
.gone{max-width:520px;margin:96px auto 0;text-align:center}
.gone .glyph{
  width:56px;height:56px;margin:0 auto 22px;border-radius:16px;border:1px dashed var(--line);
  display:grid;place-items:center;background:var(--roast-2);
}
.gone h1{font-size:23px;font-weight:700;margin-bottom:10px;letter-spacing:-.015em}
.gone p{font-size:14px;color:var(--dim);line-height:1.62;margin-bottom:14px}
.gone .acts{display:flex;gap:10px;justify-content:center;margin-top:24px}

/* a shared report, read by somebody with no account */
.sharehead{
  display:flex;align-items:flex-start;gap:14px;padding:16px 18px;border-radius:var(--r-lg);
  background:var(--roast-2);border:1px solid var(--line);margin-bottom:26px;
}
.sharehead .b{flex:1;min-width:0}
.sharehead .t{font-size:13.5px;font-weight:600;margin-bottom:3px}
.sharehead .m{font-size:12.5px;color:var(--dim-2);line-height:1.5}
.sharehead .ro{
  flex:none;font:600 10.5px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;
  color:var(--dim-2);border:1px solid var(--line);border-radius:999px;padding:5px 10px;
}

/* talk — one job, one control */
.talkgrid{display:grid;grid-template-columns:1fr;gap:22px;margin-top:8px}
@media (min-width:820px){.talkgrid{grid-template-columns:1fr 340px}}
.talkslot{
  border:1px dashed var(--line);border-radius:var(--r-lg);background:var(--roast-2);
  min-height:340px;display:grid;place-items:center;text-align:center;padding:28px;
}
.talkslot span{font-size:13px;color:var(--dim-2);max-width:36ch;line-height:1.55}
.talkaside{display:flex;flex-direction:column;gap:14px}
.talkaside .item{padding:15px 17px;border-radius:var(--r);background:var(--roast-2);border:1px solid var(--line)}
.talkaside .item b{display:block;font-size:13.5px;font-weight:600;margin-bottom:5px}
.talkaside .item span{font-size:12.5px;color:var(--dim);line-height:1.55}

</style>

/* ═══════════════════════════════════════════════════════════════════════════

].map(([key,desc,type,risk,versions])=>({key,desc,type:type||"unclassified",risk:risk||"unclassified",versions}));

/* The engineer's own words, kept but demoted. Verbatim from the current registry. */
const ENG_NOTE = {
 "checkout.stripe_enabled":"Kill-switch: when OFF, hides the Stripe card payment rail from checkout (frontend checkout-options proxy). Fail-open: default ON, and stays ON if the flag service is unreachable. Admin-only. Owner: platform.",
 "domain.paywall_enabled":"Custom-domain paywall (epic 07 · custom-domain-paywall). ENABLEMENT flag (NOT a kill-switch): OFF = ungated (today's free custom-domain behavior, fail-open default; ON = connecting a custom domain requires entitlement (grandfather/comp grant or an active custom-domain subscription) else 402. Flip ON only AFTER the backend deploy + seed-custom-domain-plan.mjs have run. Read server-side by lib/flags.ts.",
 "events.quantity_enabled":"Events: quantity selector (epic 10). ENABLEMENT polarity, default OFF => buying >1 admission for one event is capped at 1 (today's behavior). Flip ON only after Daniel's live buy-N -> N-QR -> door scan -> roster-N -> aforo-minus-N smoke passes. Enforced server-side via lib/ticket-quantity.ts at the PDP cap, /checkout clamp, and UCP checkout-session.",

const ENVS = [
  {id:"production", name:"Production", blurb:"What customers are getting right now."},
  {id:"preview",    name:"Preview",    blurb:"What the team sees on preview deploys."},

];

/* Live state, honest to the registry: 2 on in Production, 40 never turned on. */
const STATE = {

    "checkout.stripe_enabled":{s:"on",v:3,who:"Daniel",when:"2026-08-11 09:14",reason:"Planned rollout"},

  },
};

const REASONS = ["Planned rollout","Rolling back","Incident response","Testing","Cleaning up"];
const STATE_WORDS = {
  on:{label:"On", detail:r=>`serving v${r.v}`},
  off:{label:"Turned off", detail:r=>`switched off ${r.when.slice(0,10)}`},
  never:{label:"Never turned on here", detail:()=>"nobody has ever switched this"},
};
const TYPE_WORDS = {kill:"Kill switch", release:"Release toggle", unclassified:"Not classified"};
const RISK_WORDS = {high:"High risk", medium:"Medium risk", low:"Low risk", unclassified:"Risk not set"};

/* ═══ app state ═══ */
const APP = {
  env:"production", section:"ship", rail:"features",
  q:"", type:"all", risk:"all", sort:"state", group:true,
  view:"list", dormantOpen:false, page:1,
  overlay:null, modalTab:"value", wizard:null, menu:null, editingDesc:false,
  journey:null, experiment:null, route:null,
  surface:"console", hubTab:"roadmap", epic:null, door:null,
};

const $ = s=>document.querySelector(s);
const esc = s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]));

function stateOf(key, env=APP.env){
  const r = STATE[env][key];
  if(!r) return {s:"never", v:null, who:null, when:null, reason:null};
  return r;
}
function counts(env=APP.env){
  const c={on:0,off:0,never:0};
  FEATURES.forEach(f=>c[stateOf(f.key,env).s]++);
  return c;
}

/* ═══════════════════════════════════════════════════════════════════════════
   NAVIGATION — three tiers. Project (top bar) → the four questions → the rail.
   Nothing below a tier can change what is above it.
   ═══════════════════════════════════════════════════════════════════════════ */
const SECTIONS = [
  ["today","Today"],["measure","Measure"],["ship","Ship"],["setup","Setup"],
];
/* Each section owns its own rail. Flags need an environment; that scope belongs to
   Ship and nowhere else, which is why it sits in this rail and not in the top bar. */
const RAILS = {
  today:   [],
  measure: [["overview","North Star","◈"],["journeys","Journeys","◇"],["scenarios","Scenarios & drills","◆"]],
  ship:    [["features","Features","◧"],["experiments","Experiments","◑"],
            ["scheduled","Scheduled changes","◔"],["activity","Activity","≡"]],
  setup:   [["connect","Connect your agent","⌁"],["keys","Keys","⌗"],
            ["destinations","Destinations","→"],["shares","Share links","◫"]],
};
const DEFAULT_RAIL = {today:"", measure:"overview", ship:"features", setup:"connect"};
/* Setup carries a badge until it is done, then goes quiet. Progressive reduction. */
let SETUP_DONE = false;

function renderChrome(){
  if(APP.surface==="hub") return renderChromeHub();
  $("#sectionnav").innerHTML = SECTIONS.map(([id,l])=>{
    const badge = id==="setup" && !SETUP_DONE ? '<span class="badge-dot"></span>' : "";
    return `<button class="tab" role="tab" aria-selected="${APP.section===id}"
      onclick="setSection('${id}')">${l}${badge}</button>`;
  }).join("");

  const rails = RAILS[APP.section];
  const scope = $("#railscope");
  if(APP.section==="ship"){
    const e = ENVS.find(x=>x.id===APP.env);
    scope.innerHTML = `<span class="rail-label">Environment</span>
      <div class="envpick">
        <button onclick="toggleEnvMenu(event)" id="envbtn">
          <span class="env-dot ${e.id}"></span><span class="nm">${e.name}</span><span class="chev">▼</span></button>
        <div class="envmenu" id="envmenu" hidden>${ENVS.map(x=>
          `<button onclick="setEnv('${x.id}')"><span class="env-dot ${x.id}"></span>${x.name}
            <span class="cnt">${counts(x.id).on} on</span></button>`).join("")}</div>
      </div>
      <span class="rail-label">In Ship</span>`;
  } else {
    scope.innerHTML = rails.length ? `<span class="rail-label">In ${SECTIONS.find(s=>s[0]===APP.section)[1]}</span>` : "";
  }

  $("#railnav").innerHTML = rails.map(([id,l,ico])=>{
    const pip = id==="features" ? FEATURES.length : id==="keys" ? 4 : id==="scheduled" ? 0 : "";
    return `<button aria-current="${APP.rail===id}" onclick="setRail('${id}')">
      <span class="ico">${ico}</span>${l}${pip!==""?`<span class="pip">${pip}</span>`:""}</button>`;
  }).join("");

  const hasRail = rails.length>0;
  document.querySelector(".rail").hidden = !hasRail;
  document.querySelector(".frame").style.gridTemplateColumns = hasRail ? "236px minmax(0,1fr)" : "1fr";
}

function setSection(s){
  APP.section=s; APP.rail=DEFAULT_RAIL[s]; APP.overlay=null; APP.journey=null; APP.experiment=null; APP.route=null; APP.surface="console"; APP.epic=null;
  $("#projmenu").hidden=true; render();
}
function setEnv(id){ APP.env=id; const m=$("#envmenu"); if(m) m.hidden=true; render(); }
function setRail(r){ APP.rail=r; APP.journey=null; APP.experiment=null; APP.route=null; render(); }
function toggleEnvMenu(ev){ ev.stopPropagation(); const m=$("#envmenu"); m.hidden=!m.hidden; }
function toggleProjMenu(ev){ ev.stopPropagation(); const m=$("#projmenu"); m.hidden=!m.hidden; }
document.addEventListener("click",()=>{
  const e=$("#envmenu"); if(e) e.hidden=true;
  $("#projmenu").hidden=true; closeMenu();
});

/* ── ⌘K: with 42 features across 3 environments, typing the name is the real nav ── */
function openPalette(){ APP.overlay={kind:"palette", q:""}; renderOverlay();
  setTimeout(()=>{ const i=$("#pq"); if(i) i.focus(); },30); }
document.addEventListener("keydown",e=>{
  if((e.metaKey||e.ctrlKey) && e.key.toLowerCase()==="k"){ e.preventDefault(); openPalette(); }
});
function paletteResults(q){
  const s = q.trim().toLowerCase();
  const places = [
    ...SECTIONS.map(([id,l])=>({kind:"Go to", nm:l, mono:false, where:"section", go:`setSection('${id}')`})),
    ...Object.entries(RAILS).flatMap(([sec,rows])=>rows.map(([id,l])=>
      ({kind:"Go to", nm:l, mono:false, where:SECTIONS.find(x=>x[0]===sec)[1],
        go:`setSection('${sec}');setRail('${id}')`}))),
  ];
  const feats = FEATURES.map(f=>({kind:"Feature", nm:f.key, mono:true,
    where:STATE_WORDS[stateOf(f.key).s].label, go:`setSection('ship');setRail('features');openFeature('${f.key}')`}));
  const hub = [
    {kind:"Go to", nm:"Roadmap", mono:false, where:"Roadmap hub", go:"enterHub()"},
    {kind:"Go to", nm:"Horizon", mono:false, where:"Roadmap hub", go:"enterHub();setHubTab('horizon')"},
    {kind:"Go to", nm:"Report", mono:false, where:"Roadmap hub", go:"enterHub();setHubTab('report')"},
  ];
  const epics = EPICS.map(e=>({kind:"Epic", nm:e.slug, mono:true,
    where:e.state==="shipped"?"shipped":e.state==="building"?"building now":"scaffolded",
    go:`enterHub();openEpic('${e.slug}')`}));
  const all = [...feats, ...places, ...hub, ...epics];
  if(!s) return all.slice(0,8);
  return all.filter(r=>r.nm.toLowerCase().includes(s)).slice(0,10);
}
function paletteModal(o){
  const rows = paletteResults(o.q);
  return `<div class="palette" onclick="event.stopPropagation()">
    <input id="pq" placeholder="Jump to a feature or a section…" value="${esc(o.q)}"
      oninput="APP.overlay.q=this.value;paletteRefresh()">
    <div class="results" id="presults">${paletteRows(rows)}</div>
    <div class="foot">↑↓ to move · ↵ to open · esc to close</div>
  </div>`;
}
function paletteRows(rows){
  if(!rows.length) return `<div class="none">Nothing matches that.</div>`;
  return rows.map((r,i)=>`<button class="res ${i===0?"sel":""}" onclick="closeOverlay();${r.go}">
    <span class="kind">${r.kind}</span><span class="nm ${r.mono?"mono":""}">${esc(r.nm)}</span>
    <span class="whr">${esc(r.where)}</span></button>`).join("");
}
function paletteRefresh(){ $("#presults").innerHTML = paletteRows(paletteResults(APP.overlay.q)); }

/* ═══ features screen ═══ */
function visibleRows(){
  const q = APP.q.trim().toLowerCase();
  let rows = FEATURES.filter(f=>{
    if(q && !(f.key.toLowerCase().includes(q) || f.desc.toLowerCase().includes(q))) return false;
    if(APP.type!=="all" && f.type!==APP.type) return false;
    if(APP.risk!=="all" && f.risk!==APP.risk) return false;
    if(APP.stateFilter && APP.stateFilter!=="all" && stateOf(f.key).s!==APP.stateFilter) return false;
    return true;
  });
  const order = {on:0, off:1, never:2};
  const bySort = {
    state:(a,b)=> order[stateOf(a.key).s]-order[stateOf(b.key).s] || a.key.localeCompare(b.key),
    key_asc:(a,b)=> a.key.localeCompare(b.key),
    key_desc:(a,b)=> b.key.localeCompare(a.key),
    type:(a,b)=> (a.type==="kill"?0:1)-(b.type==="kill"?0:1) || a.key.localeCompare(b.key),
    recent:(a,b)=> (stateOf(b.key).when||"").localeCompare(stateOf(a.key).when||"") || a.key.localeCompare(b.key),
  };
  return rows.sort(bySort[APP.sort]);
}

function featuresScreen(){
  const c = counts(), env = ENVS.find(x=>x.id===APP.env), rows = visibleRows();
  const sf = APP.stateFilter||"all";
  const onKeys = FEATURES.filter(f=>stateOf(f.key).s==="on").map(f=>f.key);

  const answer = `<div class="answer">
    Right now <b>${env.name}</b> is serving
    ${onKeys.length ? onKeys.map(k=>`<span class="mono">${k}</span>`).join(" and ") : "nothing"}.
    ${c.off ? `<b>${c.off}</b> ${c.off===1?"feature was":"features were"} deliberately switched off here. ` : ""}
    The other <b>${c.never}</b> have never been switched on in ${env.name} — nobody turned them off, nobody ever turned them on.
  </div>`;

  const stat = (id,label,n,cls)=>`
    <button class="stat ${cls}" aria-pressed="${sf===id}" onclick="setStateFilter('${id}')">
      <span class="n">${n}</span><span class="k">${label}</span></button>`;

  /* ── Why this list is not simply truncated ───────────────────────────────────
     Truncating 42 identical rows to 15 gives you 15 rows that say the same thing.
     40 of them are "never turned on here": no information apart, a lot of
     information together. So the uniform majority collapses to ONE row and the
     exceptional few stay expanded — and pagination only exists inside the
     collapsed group, where it is the rare case rather than the default. */
  const filtering = APP.q || APP.type!=="all" || APP.risk!=="all" || APP.stateFilter;
  const grouped = APP.sort==="state" && !filtering;
  const live = grouped ? rows.filter(f=>stateOf(f.key).s!=="never") : rows;
  const dormant = grouped ? rows.filter(f=>stateOf(f.key).s==="never") : [];
  const PER = 15;
  const pages = Math.max(1, Math.ceil(dormant.length/PER));
  const page = Math.min(APP.page, pages);

  let body="", last=null;
  if(!rows.length){
    body = `<div class="empty"><b>Nothing matches this view</b>
      <span>Clear the filters to see all ${FEATURES.length} features again.</span>
      <div style="margin-top:14px"><button class="btn btn-ghost btn-sm" onclick="clearFilters()">Clear filters</button></div></div>`;
  } else {
    live.forEach(f=>{
      const st = stateOf(f.key);
      if(grouped && st.s!==last){
        last = st.s;
        const n = live.filter(r=>stateOf(r.key).s===st.s).length;
        const head = {on:"On in "+env.name, off:"Turned off here", never:"Never turned on here"}[st.s];
        body += `<div class="grp ${st.s}"><span class="bar"></span>${head}<span class="cnt">${n}</span></div>`;
      }
      body += rowHTML(f, st);
    });
    if(dormant.length){
      body += `<button class="dormant" onclick="APP.dormantOpen=!APP.dormantOpen;APP.page=1;render()">
        <span class="tw">${APP.dormantOpen?"▾":"▸"}</span>
        <span><span class="t">${dormant.length} features have never been turned on in ${env.name}</span>
        <span class="d">No one has ever switched them on or off here. Nothing is wrong with them — nothing has happened to them.</span></span>
        <span class="go">${APP.dormantOpen?"Hide":"Show them"}</span></button>`;
      if(APP.dormantOpen){
        dormant.slice((page-1)*PER, page*PER).forEach(f=>{ body += rowHTML(f, stateOf(f.key)); });
        if(pages>1){
          body += `<div class="row" style="justify-content:center;gap:14px;background:var(--roast-2)">
            ${page>1?`<button class="btn btn-ghost btn-sm" onclick="APP.page=${page-1};render()">Previous</button>`:""}
            <span class="state-detail" style="margin:0">Page ${page} of ${pages}</span>
            ${page<pages?`<button class="btn btn-ghost btn-sm" onclick="APP.page=${page+1};render()">Next</button>`:""}
          </div>`;
        }
      }
    }
  }
  const shown = grouped ? live.length + (APP.dormantOpen ? Math.min(PER, dormant.length-(page-1)*PER) : 0) : rows.length;

  if(APP.view==="compare") return compareScreen();

  return `
  <div class="page-head">
    <div>
      <h1>Features</h1>
      <p>Everything this project can switch, and what ${env.name} is doing with it. ${env.blurb}</p>
    </div>
    <div class="spacer"></div>
    <button class="btn btn-ghost" onclick="APP.view='compare';render()">Compare environments</button>
    <button class="btn btn-primary" onclick="openWizard()">+ New feature</button>
  </div>
  ${answer}
  <div class="summary">
    ${stat("all","All features",FEATURES.length,"all")}
    ${stat("on","On in "+env.name,c.on,"on")}
    ${stat("off","Turned off here",c.off,"off")}
    ${stat("never","Never turned on here",c.never,"never")}
  </div>
  <div class="toolbar">
    <label class="search">
      <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6">
        <circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5 14 14"/></svg>
      <input type="search" placeholder="Search features" value="${esc(APP.q)}"
        oninput="APP.q=this.value;renderContent();restoreSearch()" id="searchbox">
    </label>
    <span class="sel"><select onchange="APP.type=this.value;render()">
      <option value="all"${APP.type==="all"?" selected":""}>All types</option>
      <option value="kill"${APP.type==="kill"?" selected":""}>Kill switches</option>
      <option value="release"${APP.type==="release"?" selected":""}>Release toggles</option>
      <option value="unclassified"${APP.type==="unclassified"?" selected":""}>Not classified</option>
    </select></span>
    <span class="sel"><select onchange="APP.risk=this.value;render()">
      <option value="all"${APP.risk==="all"?" selected":""}>Any risk</option>
      <option value="high"${APP.risk==="high"?" selected":""}>High risk</option>
      <option value="medium"${APP.risk==="medium"?" selected":""}>Medium risk</option>
      <option value="low"${APP.risk==="low"?" selected":""}>Low risk</option>
      <option value="unclassified"${APP.risk==="unclassified"?" selected":""}>Risk not set</option>
    </select></span>
    <span class="sel"><select onchange="APP.sort=this.value;render()">
      <option value="state"${APP.sort==="state"?" selected":""}>Group by state</option>
      <option value="recent"${APP.sort==="recent"?" selected":""}>Recently changed</option>
      <option value="key_asc"${APP.sort==="key_asc"?" selected":""}>Name A–Z</option>
      <option value="key_desc"${APP.sort==="key_desc"?" selected":""}>Name Z–A</option>
      <option value="type"${APP.sort==="type"?" selected":""}>Kill switches first</option>
    </select></span>
  </div>
  <div class="listcard">
    <div class="listhead">
      <span style="flex:1">Feature</span>
      <span class="h-state">State in ${env.name}</span>
      <span class="h-meta">Type &amp; risk</span>
      <span class="h-act">On / off</span>
    </div>
    ${body}
  </div>
  <p style="margin-top:12px;font-size:12.5px;color:var(--dim-2)">
    Showing ${shown} rows for ${rows.length} features${grouped&&!APP.dormantOpen?` — ${dormant.length} of them summarised in one line`:""}.
  </p>`;
}

function rowHTML(f, st){
  const w = STATE_WORDS[st.s];

    <div class="row-main" onclick="openFeature('${f.key}')">
      <div class="row-key">${f.key}</div>
      <div class="row-desc">${esc(f.desc)}</div>
    </div>
    <div class="row-state">
      <span class="pill ${st.s}"><span class="dot"></span>${w.label}</span>
      <div class="state-detail">${w.detail(st)}</div>
    </div>
    <div class="row-meta">
      <span class="tag ${f.type==="kill"?"kill":""} ${f.type==="unclassified"?"unclassified":""}">${TYPE_WORDS[f.type]}</span>
      <span class="tag ${f.risk==="high"?"risk-high":""} ${f.risk==="unclassified"?"unclassified":""}">${RISK_WORDS[f.risk]}</span>
    </div>
    <div class="row-act">
      <button class="sw ${st.s}" title="${st.s==="on"?"Turn off":"Turn on"} in ${APP.env}"
        aria-label="${st.s==="on"?"Turn off":"Turn on"} ${f.key} in ${APP.env}"
        onclick="event.stopPropagation();requestToggle('${f.key}')"></button>
      <button class="kebab" aria-label="More actions for ${f.key}"
        onclick="event.stopPropagation();openMenu(event,'${f.key}')">⋯</button>
