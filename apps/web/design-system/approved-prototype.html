};
const CONTROL_NAMES = ["Current","Current copy","Current price","Current flow","Off"];
const TREAT_NAMES   = ["New copy","New price","New step","New layout","On","Version B","Version C","Version D"];
const OUTCOME_WORDS = {ship_treatment:"Ship the new version", keep_control:"Keep the current version",
  iterate:"Change it and run again", inconclusive:"Call it inconclusive", invalid:"Mark it invalid"};
const DECISION_REASONS = ["The main number improved and guardrails held","It's no worse and simpler to keep",
  "A guardrail cost more than the win","Something outside the test decided it"];

/* the three experiments already on the approved list */
const EXISTING = [
  {key:"checkout_one_page", hyp:"One-page checkout converts better than three steps.", pill:"ready", day:13, lift:18.1, liftGood:true, metric:"Completed checkouts"},
  {key:"listing_photo_hints", hyp:"Showing photo examples raises completed listings.", pill:"gathering", day:3, lift:8.4, liftGood:false, metric:"Completed listings"},

];

/* ═══ state ═══ */
const APP = {view:"list", exp:null, tab:"results", day:9, overlay:null, notes:false, showAllMetrics:false, showAllGuards:false, decide:null};
let W = null;              // the builder's draft (kept while the page is open)
const CREATED = [];        // experiments made in this session

function newDraft(tpl="copy"){ const w = {step:1, tpl, weeksTouched:false, start:"now"}; applyTemplate(w, tpl); return w; }
function applyTemplate(w, tpl){
  const t = TEMPLATES[tpl];
  Object.assign(w, {
    tpl, feature:t.feature, why:t.why, dir:t.dir, metric:t.metric, guards:[...t.guards], segs:[...t.segs], mde:t.mde,
    split:t.split, entity:t.entity,
    who:{mode:t.rules.length?"some":"everyone", rules:clone(t.rules), pct:100},
    variants:t.names.map(name => ({name, shot:null})),

  });

/* ═══ the maths (show it as days, never as a formula) ═══════════════════════
   n ≈ 16·p(1−p)/δ² per version, 80% power, α = 0.05, δ = p × MDE. */
function sampleSize(p, mdePct){ const d = p * mdePct/100; return Math.ceil(16 * p * (1-p) / (d*d)); }
function weights(w){
  const k = w.variants.length;
  if(k === 2) return [100 - w.split, w.split];
  const even = Math.floor(100 / k); const ws = w.variants.map(() => even); ws[0] += 100 - even*k; return ws;
}
function ruleFraction(r){
  const F = FIELDS[r.field]; const share = F.vals.filter(v => r.vals.includes(v[0])).reduce((a,v) => a + v[2], 0);
  return F.cov * share;
}
function dailyEligible(w){
  let f = 1;
  if(w.who.mode === "some") w.who.rules.forEach(r => f *= ruleFraction(r));
  return ENTITIES[w.entity].daily * f * (w.who.pct/100);
}
function needPerVersion(w){ return sampleSize(EV[w.metric].base/100, w.mde); }
function estDays(w, mde = w.mde){
  const n = sampleSize(EV[w.metric].base/100, mde);
  const minW = Math.min(...weights(w)) / 100;
  const daily = dailyEligible(w) * minW;
  return daily > 0 ? Math.ceil(n / daily) : Infinity;
}
function recommendedWeeks(w){ const d = estDays(w); return isFinite(d) ? Math.max(2, Math.ceil(d/7)) : 4; }
const WEEK_OPTS = [1,2,3,4,6,8];
function syncWeeks(){ if(W && !W.weeksTouched) W.weeks = Math.min(8, WEEK_OPTS.find(x => x >= recommendedWeeks(W)) || 8); }

/* dates — today is Thursday 24 September 2026 */
const TODAY = new Date(2026, 8, 24);
function startDate(w){ return w.start === "now" ? TODAY : new Date(2026, 8, 28); }
function addDays(d, n){ const x = new Date(d); x.setDate(x.getDate()+n); return x; }
const dstr = d => `${["Sun","Mon","Tue","Wed","Thu","Fri","Sat"][d.getDay()]} ${d.getDate()} ${["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"][d.getMonth()]}`;
const iso = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}T09:00:00-06:00`;

/* ═══ words ═══ */
function joinOr(a){ return a.length <= 1 ? (a[0]||"") : a.slice(0,-1).join(", ") + " or " + a[a.length-1]; }
function joinAnd(a){ return a.length <= 1 ? (a[0]||"") : a.slice(0,-1).join(", ") + " and " + a[a.length-1]; }
function ruleWords(r){
  const L = r.vals.map(v => valLabel(r.field, v));
  if(!L.length) return "";
  return {region:`in ${joinOr(L)}`, channel:`on ${joinOr(L)}`, plan:`on the ${joinOr(L)} plan`,
    source:`who came from ${joinOr(L)}`, campaign:`from the ${joinOr(L)} campaign`}[r.field];
}
function whoWords(w){
  const base = ENTITIES[w.entity].plural;
  if(w.who.mode === "everyone") return `${base} who reach it`;
  const parts = w.who.rules.map(ruleWords).filter(Boolean);
  return parts.length ? `${base} ${joinAnd(parts)}` : base;
}
function shareWords(p){ return p === 50 ? "half" : p === 100 ? "all" : p === 25 ? "a quarter" : `${Math.round(p*10)/10}%`; }
function treatNames(w){ return joinAnd(w.variants.slice(1).map(v => v.name)); }
function guardWords(w){
  const up = w.guards.filter(g => EV[g].dir === "decrease").map(g => EV[g].noun);

  const out = [];
  if(up.length) out.push(`${joinAnd(up)} don't rise`);
  if(down.length) out.push(`${joinAnd(down)} don't drop`);
  return out;
}
/* the one plain sentence the review leads with */

  const em = s => hl ? `<em>${esc(s)}</em>` : esc(s);
  const ws = weights(w), tShare = w.variants.length === 2 ? ws[1] * w.who.pct / 100 : ws[1] * w.who.pct / 100;
  const each = w.variants.length > 2 ? " each" : "";
  const who = whoWords(w), m = EV[w.metric], g = guardWords(w);
  if(TEMPLATES[w.tpl].guarded){
    return `${em(treatNames(w))} goes to ${em(shareWords(tShare))} of ${em(who)} first. It's safe to go further if ${em(m.noun)} don't drop${g.length?` and ${g.map(x=>em(x)).join(" and ")}`:""}.`;
  }
  const move = w.dir === "increase" ? "rise" : "fall";
  return `${em(treatNames(w))}${each} go${each?"":"es"} to ${em(shareWords(tShare))} of ${em(who)}. It wins if ${em(m.noun)} ${move} by at least ${em(w.mde+"%")}${g.length?`, as long as ${g.map(x=>em(x)).join(" and ")}`:""}.`;
}
function hypothesisText(w){
  const t = TEMPLATES[w.tpl];
  const verb = t.guarded ? "won't lower" : (w.dir === "increase" ? "will raise" : "will lower");
  return `We believe showing ${w.variants[1].name} to ${whoWords(w)} ${verb} ${EV[w.metric].noun} because ${REASONS[w.why]}.`;
}
function featureShort(k){ return k === "__new" ? newFeatureKey().split(".")[1].replace(/_enabled$/,"") : k.split(".")[1].replace(/_enabled$/,""); }
function newFeatureKey(){ const area = TEMPLATES[W.tpl].feature.split(".")[0]; return `${area}.${TEMPLATES[W.tpl].suffix}_enabled`; }
function expKey(w){ return `${featureShort(w.feature)}_${TEMPLATES[w.tpl].suffix}`.slice(0,64); }
function featureKey(w){ return w.feature === "__new" ? newFeatureKey() : w.feature; }
const slug = s => s.toLowerCase().replace(/[^a-z0-9]+/g,"_").replace(/^_|_$/g,"");

/* ═══ the pre-launch checklist — computed, never ticked by hand ═══════════ */
function checks(w){
  const out = [];
  const fk = featureKey(w), f = FEATURES.find(x => x.key === fk);
  if(w.feature === "__new") out.push({s:"fail", step:1, t:"The feature has no code behind it yet",
    d:`<span class="mono">${fk}</span> is created with this test, but nothing in Production checks it. Save a draft now and start once the code ships.`,
    fix:"Pick an existing feature", act:"setStep(1)"});
  else if(!f.evals) out.push({s:"fail", step:1, t:"No live code checks this feature",
    d:`<span class="mono">${fk}</span> wasn't checked once in Production in the last 7 days, so nobody would ever see a version.`,
    fix:"Pick another feature", act:"setStep(1)"});
  else out.push({s:"ok", step:1, t:"The feature is live in Production",
    d:`<span class="mono">${fk}</span> was checked ${fmt(f.evals)} times today, most recently 4 minutes ago.`});

  const evs = [w.metric, ...w.guards], dead = evs.filter(e => !EV[e].last24);
  if(dead.length) out.push({s:"fail", step:4, t:"A metric has gone quiet",
    d:`${dead.map(e=>`<span class="mono">${e}</span>`).join(", ")} arrived 0 times in the last 24 hours. Is its tracking still running?`,
    fix:"Choose a different metric", act:"setStep(4)"});
  else out.push({s:"ok", step:4, t:"Every metric arrived in the last 24 hours",
    d:`<span class="mono">${w.metric}</span> ${fmt(EV[w.metric].last24)} times${w.guards.length?`, and all ${w.guards.length} guardrail${w.guards.length>1?"s":""} too`:""}.`});

  if(w.who.mode === "everyone" || !w.who.rules.length) out.push({s:"ok", step:2, t:"Everyone who reaches it can be in the test", d:"No tags to check."});
  else {
    const worst = w.who.rules.map(r => ({r, cov:FIELDS[r.field].cov})).sort((a,b) => a.cov - b.cov)[0];
    const empty = w.who.rules.find(r => !r.vals.length);
    if(empty) out.push({s:"fail", step:2, t:"A condition has no value picked", d:`Pick at least one ${FIELDS[empty.field].label.toLowerCase()}, or remove the condition.`, fix:"Fix who's in it", act:"setStep(2)"});
    else if(worst.cov < 0.1) out.push({s:"fail", step:2, t:"Your events don't carry one of the tags",
      d:`Only ${Math.round(worst.cov*100)}% of recent events carry <span class="mono">${worst.r.field}</span>, so almost nobody can match it and the test would never fill.`,
      fix:`Remove the ${FIELDS[worst.r.field].label.toLowerCase()} condition`, act:`removeRuleByField('${worst.r.field}')`});
    else if(worst.cov < 0.9) out.push({s:"warn", step:2, t:"One tag is missing from some events",
      d:`${Math.round(worst.cov*100)}% of recent events carry <span class="mono">${worst.r.field}</span>. People whose events lack it are left out, which the estimate already counts.`});
    else out.push({s:"ok", step:2, t:"Your eligibility tags appear on recent events",
      d:w.who.rules.map(r => `<span class="mono">${r.field}</span> on ${Math.round(FIELDS[r.field].cov*100)}%`).join(" · ")});
  }

  const ws = weights(w);
  out.push({s:"ok", step:3, t:"The split adds up", d:`${ws.join(" / ")}, which is 100%.`});

  const days = estDays(w), planned = w.weeks * 7;
  if(!isFinite(days)) out.push({s:"fail", step:2, t:"Nobody matches who's in it", d:"With these conditions no one would enter the test.", fix:"Loosen who's in it", act:"setStep(2)"});
  else if(planned < days) out.push({s:"fail", step:5, t:"The test ends before it has enough people",
    d:`${w.weeks} week${w.weeks>1?"s":""} planned, but it needs about ${days} days at your current traffic.`,
    fix:`Run it for ${WEEK_OPTS.find(x => x*7 >= days) || 8} weeks`, act:`setWeeks(${WEEK_OPTS.find(x => x*7 >= days) || 8})`});
  else out.push({s:"ok", step:5, t:"It runs long enough", d:`${w.weeks} weeks planned, about ${days} days needed.`});

  out.push({s:"ok", step:null, t:"Split checking is on", d:`Every day we check that people are divided ${ws.join(" / ")} and alert you if they drift (p < 0.01).`});
  return out;
}
const failing = w => checks(w).filter(c => c.s === "fail");

/* ═══ small pieces ═══ */
const bn = f => `<span class="bn">${f}</span>`;
const mk = s => `<span class="mk ${s}" aria-hidden="true">${s==="ok"?"✓":s==="warn"?"!":"✕"}</span>`;
function spark(ev){
  let seed = ev.ev.length * 7 + ev.n14; const pts = [];
  for(let i=0;i<14;i++){ seed = (seed * 9301 + 49297) % 233280; pts.push(0.55 + 0.45 * (seed/233280) * (i%7===5||i%7===6?0.6:1)); }
  if(!ev.last24) pts[13] = 0.02;
  const max = Math.max(...pts), step = 64/13;
  const d = pts.map((p,i) => `${i?"L":"M"}${(i*step).toFixed(1)} ${(20 - p/max*17).toFixed(1)}`).join(" ");
  return `<svg class="spark" viewBox="0 0 64 22" aria-hidden="true"><path d="${d} L64 22 L0 22Z" style="fill:rgb(232 185 60 / 12%)"/><path d="${d}" style="fill:none;stroke:var(--gold);stroke-width:1.3"/><circle cx="64" cy="${(20 - pts[13]/max*17).toFixed(1)}" r="2" style="fill:${ev.last24?"var(--gold-hot)":"var(--red)"}"/></svg>`;
}
function splitBar(w){
  const ws = weights(w);
  return `<div class="x-splitbar" role="img" aria-label="Split ${ws.join(" / ")}">${w.variants.map((v,i) =>
    `<span class="${i?"t":"c"}" style="flex-basis:${ws[i]}%">${ws[i] >= 12 ? `${esc(v.name)} · ${ws[i]}%` : `${ws[i]}%`}</span>`).join("")}</div>`;
}

/* ── 2 · Who's in it? ── */
function stepWho(){

  const rules = w.rules.map((r,i) => {
    const F = FIELDS[r.field], cov = F.cov, s = cov >= 0.9 ? "ok" : cov >= 0.1 ? "warn" : "fail";
    const covText = s === "ok" ? `${Math.round(cov*100)}% of recent events carry this tag.`
      : s === "warn" ? `Only ${Math.round(cov*100)}% of recent events carry this tag. People whose events lack it are left out.`
      : `Only ${Math.round(cov*100)}% of recent events carry this tag, so almost nobody can match. The test would never fill.`;
    return `<div class="x-rule">

          ${[r.field, ...free].map(f => `<option value="${f}"${f===r.field?" selected":""}>${FIELDS[f].label}</option>`).join("")}</select></span>

      </div>
      <div class="x-cov">${mk(s)}<span>${covText}</span></div>
    </div>`;
  }).join("");
  return `

    <div class="chips" style="margin-bottom:8px">${[10,25,50,100].map(p => `<button class="chip" aria-pressed="${w.pct===p}" onclick="W.who.pct=${p};afterChange()">${p}%</button>`).join("")}</div>
    <input type="range" class="x-range" id="wpct" min="5" max="100" step="5" value="${w.pct}" style="--fill:${(w.pct-5)/95*100}%"

    <div class="x-ticks"><span>5%</span><span>50%</span><span>100%</span></div>
    <div id="wholive">${whoLive()}</div>
  </div>
  <div class="field"><span class="lab">Count each${bn("assignmentEntityType")}</span>
    <div class="picklist">

/* Deterministic example results, so every reviewer sees the same thing. */
function simulate(x, day){
  const w = x.w, t = TEMPLATES[w.tpl], p = EV[w.metric].base / 100, ws = weights(w), daily = dailyEligible(w);
  const need = needPerVersion(w), planned = w.weeks * 7;
  const d = Math.min(day, planned);
  const nC = Math.round(daily * ws[0]/100 * d), nT = Math.round(daily * ws[1]/100 * d);
  const noise = i => i > 0 ? 5.2 * Math.sin(i*1.7 + 1) / Math.sqrt(i) : 0;
  const lift = d ? t.lift + noise(d) : 0;
  const se = d ? Math.sqrt((1-p)/(p*Math.max(nC,1)) + (1-p)/(p*Math.max(nT,1))) * 100 : 0;
  const lo = lift - 1.96*se, hi = lift + 1.96*se;
  const cRate = p*100, tRate = cRate * (1 + lift/100);
  const enough = Math.min(nC, nT) >= need;
  const good = t.guarded ? lo > -w.mde : (w.dir === "increase" ? lo > 0 : hi < 0);
  const bad = !t.guarded && (w.dir === "increase" ? hi < 0 : lo > 0);
  const state = x.status === "decided" ? "decided" : d === 0 ? "waiting" : !enough ? "gathering" : "ready";
  const remain = enough ? 0 : Math.ceil((need - Math.min(nC,nT)) / (daily * Math.min(...ws)/100));
  const guards = w.guards.map((g,i) => ({g, delta: d ? [-2.1, 0.4, -0.8][i % 3] * Math.min(1, d/5) : 0, ok:true}));
  return {d, planned, nC, nT, need, lift, lo, hi, cRate, tRate, enough, good:d>0 && good, bad, state, remain, guards,
    frac: Math.min(1, Math.min(nC,nT)/need), srm: d >= 2 ? "clear" : "not_evaluable", t};
}

function openExp(key){ APP.exp = key; APP.view = "detail"; render(); window.scrollTo(0,0); }
function goList(){ APP.view = "list"; APP.exp = null; render(); }

function detailScreen(){
  const x = CREATED.find(c => c.key === APP.exp), w = x.w, s = simulate(x, APP.day), A = w.variants[0].name, B = w.variants[1].name;
  const pill = x.status === "decided" ? `<span class="pill on"><span class="dot"></span>Decided</span>`
    : s.state === "ready" ? `<span class="pill on"><span class="dot"></span>Ready to decide</span>`
    : `<span class="pill never"><span class="dot"></span>${s.state === "waiting" ? "Just started" : "Still gathering"}</span>`;
  const days = [0, Math.max(3, Math.round(s.planned*0.25)), Math.round(s.planned*0.64), s.planned];
  return `
  <div class="crumbrow"><button onclick="goList()">← Experiments</button><span class="sep">/</span><span class="mono">${x.key}</span></div>
  <div class="page-head">
    <div><h1 class="mono" style="font-size:23px">${x.key}</h1><p>${esc(hypothesisText(w))}</p></div>
    <div class="spacer"></div>${pill}
  </div>
  ${x.status === "decided" ? "" : `<div class="x-proto"><span class="proto-pill">Prototype</span><span>See this page on</span>
    <div class="chips">${days.map(d => `<button class="chip" aria-pressed="${APP.day===d}" onclick="APP.day=${d};render()">day ${d}${d===s.planned?" · planned end":""}</button>`).join("")}</div></div>`}
  <div class="answer">${answerLine(x, s)}</div>
  <div class="x-ptabs" role="tablist">
    <button class="tab" role="tab" aria-selected="${APP.tab==="results"}" onclick="APP.tab='results';render()">Results</button>
    <button class="tab" role="tab" aria-selected="${APP.tab==="plan"}" onclick="APP.tab='plan';render()">Plan</button>
  </div>
  ${APP.tab === "results" ? resultsTab(x, s) : planTab(x)}`;
}
function answerLine(x, s){
  const w = x.w, A = w.variants[0].name, B = w.variants[1].name, m = EV[w.metric];
  const sign = v => (v > 0 ? "+" : "") + v.toFixed(1) + "%";
  if(x.status === "decided") return `<b>Decided: ${OUTCOME_WORDS[x.outcome].toLowerCase()}.</b> ${esc(x.outcome==="ship_treatment"?B:A)} is on for everyone in Production. The decision and its reason are recorded.`;
  if(s.state === "waiting") return `<b>It's live. Results start tomorrow.</b> ${esc(ENTITIES[w.entity].plural.replace(/^./,c=>c.toUpperCase()))} are being split ${weights(w).join(" / ")} from now. It needs ${fmt(s.need)} per version, about ${estDays(w)} days.`;
  const lead = s.t.guarded
    ? (s.lo > -w.mde ? `<b>${esc(B)} is holding: ${esc(m.noun)} ${sign(s.lift)}</b>` : `<b>${esc(B)} may be hurting ${esc(m.noun)}: ${sign(s.lift)}</b>`)
    : s.lift >= 0.5 ? `<b>${esc(B)} is ahead, ${sign(s.lift)}</b>` : s.lift <= -0.5 ? `<b>${esc(B)} is behind, ${sign(s.lift)}</b>` : `<b>No difference yet</b>`;
  const tail = s.state === "ready"
    ? (s.good ? " The whole range is on the right side of zero, so you can call it." : " The range still includes no difference, so the honest call is that it didn't move.")
    : ` ${Math.round(s.frac*100)}% of the planned sample, so don't call it yet. About ${s.remain} more day${s.remain===1?"":"s"}.`;
  return `${lead} (range ${sign(s.lo)} to ${sign(s.hi)}). Guardrails fine, ${s.srm === "clear" ? "split checks out" : "split can't be checked until day 2"}.${tail}`;
}

function resultsTab(x, s){
  const w = x.w, A = w.variants[0].name, B = w.variants[1].name, m = EV[w.metric];
  const sign = v => (v > 0 ? "+" : "") + v.toFixed(1);
  const liftCls = !s.d ? "flat-c" : s.good ? "up-c" : s.bad ? "down-c" : "flat-c";
  return `
  <div class="x-res-top">
    <div class="x-card">
      <div class="x-lift">
        <div><div class="n ${liftCls}">${s.d ? `${sign(s.lift)}%` : "—"}${s.d && Math.abs(s.lift) >= 0.5 ? `<span class="arw">${s.lift>0?"↑":"↓"}</span>` : ""}</div>
          <div class="k">${esc(m.label)} · ${esc(B)} vs ${esc(A)}</div></div>
        <div class="x-legend"><span><i style="background:#8d8069"></i>${esc(A)}</span><span><i style="background:var(--blue)"></i>${esc(B)}</span></div>
      </div>
      ${s.d ? liftChart(x, s) : `<div class="x-empty-chart"><div><b>The chart fills in from tomorrow</b>One point a day, per version, so a single odd day can't fool you.</div></div>`}
    </div>
    ${verdictCard(x, s)}
  </div>
  <div class="x-kpis" style="grid-template-columns:repeat(auto-fit,minmax(170px,1fr))">
    <div class="x-kpi"><div class="k">${esc(A)}</div><div class="n">${s.d ? s.cRate.toFixed(1)+"%" : "—"}</div><div class="d">${fmt(s.nC)} ${ENTITIES[w.entity].plural}</div></div>
    <div class="x-kpi"><div class="k">${esc(B)}</div><div class="n ${liftCls}">${s.d ? s.tRate.toFixed(1)+"%" : "—"}${s.d?`<small>${sign(s.lift)}%</small>`:""}</div><div class="d">${fmt(s.nT)} ${ENTITIES[w.entity].plural}</div></div>
    ${s.guards.slice(0,2).map(g => `<div class="x-kpi"><div class="k">${esc(EV[g.g].label)} <span style="color:var(--dim-2)">· guardrail</span></div>
      <div class="n ${s.d ? "flat-c" : ""}">${s.d ? `${g.delta>0?"+":""}${g.delta.toFixed(1)}%` : "—"}</div><div class="d">${s.d ? `${mk("ok")} within limits` : "nothing yet"}</div></div>`).join("")}
  </div>
  ${s.d ? `<div class="x-two">
    <div class="listcard" style="padding:20px">
      <span class="rail-label" style="margin-bottom:6px">How sure we are</span>
      ${ciBlock(s)}
    </div>
    <div class="listcard" style="padding:20px">
      <span class="rail-label" style="margin-bottom:12px">Who saw what</span>
      <div class="vbars">${[[A,"control",s.nC],[B,"treatment",s.nT]].map(([nm,k,n]) => `<div class="vbar">
        <div class="t"><span class="nm"><i class="${k}"></i>${esc(nm)}</span><span class="num">${fmt(n)} of ${fmt(s.need)} needed</span></div>
        <div class="track"><div class="fill ${k}" style="width:${Math.min(100, n/s.need*100).toFixed(1)}%"></div></div></div>`).join("")}</div>
      <div style="display:flex;align-items:center;gap:10px;margin-top:14px;font-size:13px;color:var(--dim)">
        ${s.srm === "clear" ? `<span class="pill on"><span class="dot"></span>Split checks out</span>People were divided as designed.`
          : `<span class="pill never"><span class="dot"></span>Can't tell yet</span>Too few people to check the split.`}</div>
    </div>
  </div>` : ""}`;
}
function verdictCard(x, s){
  const w = x.w, A = w.variants[0].name, B = w.variants[1].name, fk = featureKey(w);
  const prog = `<div><div class="x-progress"><i style="width:${(s.frac*100).toFixed(1)}%"></i></div>
    <div class="x-progress-cap"><span>${Math.round(s.frac*100)}% of the sample</span><span>day ${s.d} of ${s.planned}</span></div></div>`;
  if(x.status === "decided") return `<div class="x-verdict ready"><span class="rail-label">Decision</span>
    <h3>${esc(x.outcome==="ship_treatment"?B:A)} is on for everyone.</h3>
    <p>${esc(x.reason)}. Recorded by Daniel, ${dstr(addDays(startDate(w), s.planned))}.</p>
    <p class="mono" style="font-size:12px;color:var(--dim-2)">${fk} → ${x.outcome==="ship_treatment"?"on":"off"} · Production</p></div>`;
  if(s.state === "waiting") return `<div class="x-verdict"><span class="rail-label">What happens next</span>
    <h3>Let it run. Nothing to decide yet.</h3>
    <p>We'll tell you on Today when it's ready to call, in about ${estDays(w)} days. Until then, peeking at a number can only mislead you.</p>${prog}
    <div class="acts"><button class="btn btn-ghost btn-sm" onclick="toast('Stopping asks for a reason, then the version never runs again')">Stop experiment</button></div></div>`;
  if(s.state === "gathering") return `<div class="x-verdict"><span class="rail-label">What happens next</span>
    <h3>Keep it running. About ${s.remain} more day${s.remain===1?"":"s"}.</h3>
    <p>${Math.abs(s.lift) >= 0.5 ? `${esc(B)} is ${s.lift>0?"ahead":"behind"} today, but with this few people that can still flip.` : "No real gap yet."} The button to roll out appears once there are enough people to trust the result.</p>${prog}
    <div class="acts"><button class="btn btn-ghost btn-sm" onclick="toast('Stopping asks for a reason, then the version never runs again')">Stop experiment</button></div></div>`;
  if(s.t.guarded) return `<div class="x-verdict ready"><span class="rail-label">Ready</span>
    <h3>${esc(B)} is safe. Roll it further?</h3>
    <p>${esc(EV[w.metric].noun.replace(/^./,c=>c.toUpperCase()))} held and no guardrail moved.</p>
    <div class="acts"><button class="btn btn-primary" onclick="openDecide('ship_treatment')">Roll out ${esc(B)} to everyone</button>
      <button class="btn btn-ghost" onclick="openDecide('keep_control')">Turn it off</button></div></div>`;
  if(s.good) return `<div class="x-verdict ready"><span class="rail-label">Ready</span>
    <h3>${esc(B)} is winning. Roll it out?</h3>
    <p>${esc(EV[w.metric].noun.replace(/^./,c=>c.toUpperCase()))} are up ${s.lift.toFixed(1)}%, the guardrails held and the split checks out.</p>
    <div class="acts"><button class="btn btn-primary" onclick="openDecide('ship_treatment')">Roll out ${esc(B)} to everyone</button>
      <button class="btn btn-ghost" onclick="openDecide('keep_control')">Keep ${esc(A)}</button></div></div>`;
  return `<div class="x-verdict"><span class="rail-label">Ready</span>
    <h3>${s.bad ? `${esc(B)} is worse. Keep ${esc(A)}.` : `No real difference. Keep ${esc(A)}?`}</h3>
    <p>There were enough people to see a ${w.mde}% change, and it didn't show up.</p>
    <div class="acts"><button class="btn btn-primary" onclick="openDecide('keep_control')">Keep ${esc(A)}</button>
      <button class="btn btn-ghost" onclick="openDecide('iterate')">Change it and run again</button></div></div>`;
}
function ciBlock(s){
  const bound = Math.max(Math.abs(s.lo), Math.abs(s.hi), 5) * 1.15, pos = v => ((v + bound)/(bound*2))*100;
  const sign = v => (v > 0 ? "+" : "") + v.toFixed(1) + "%";
  const crosses = s.lo <= 0 && s.hi >= 0;
  return `<div class="hero-sub" style="margin-bottom:8px">${crosses ? "The range still includes “no difference”" : "The whole range sits on one side of zero"}</div>
    <div class="ci"><div class="axis0" style="left:${pos(0).toFixed(1)}%"></div>
      <div class="rng" style="left:${pos(s.lo).toFixed(1)}%;width:${(pos(s.hi)-pos(s.lo)).toFixed(1)}%"></div>
      <div class="pt" style="left:${pos(s.lift).toFixed(1)}%"></div></div>
    <div class="cikey"><span>${sign(s.lo)}</span><span style="color:var(--dim)">no difference</span><span>${sign(s.hi)}</span></div>
    <p class="hint" style="margin-top:12px">${crosses ? "Until the bar clears the line, “no difference” is still one of the answers the data allows." : "The data rules out “no difference”. The only question left is by how much."}</p>`;
}
function liftChart(x, s){
  /* cumulative rate per version, day by day. Control grey, treatment blue (DD4). */
  const W_ = 640, H = 210, ml = 44, mr = 14, mt = 10, mb = 28, iw = W_-ml-mr, ih = H-mt-mb;
  const base = s.cRate, pts = [];
  for(let i=1;i<=s.d;i++){
    const c = base * (1 + 0.07*Math.sin(i*1.3)/Math.sqrt(i));
    const l = s.t.lift + 5.2*Math.sin(i*1.7+1)/Math.sqrt(i);
    pts.push([i, c, c*(1+l/100)]);
  }
  const all = pts.flatMap(p => [p[1], p[2]]);
  let lo = Math.floor(Math.min(...all) - 1), hi = Math.ceil(Math.max(...all) + 1);
  const stepY = (hi-lo) > 12 ? 5 : (hi-lo) > 6 ? 2 : 1; lo = Math.floor(lo/stepY)*stepY; hi = Math.ceil(hi/stepY)*stepY;
  const X = d => ml + (d / s.planned) * iw, Y = v => mt + ih - (v-lo)/(hi-lo)*ih;
  const line = k => pts.map((p,i) => `${i?"L":"M"}${X(p[0]).toFixed(1)} ${Y(p[k]).toFixed(1)}`).join(" ");
  const yt = []; for(let v=lo; v<=hi+1e-9; v+=stepY) yt.push(v);
  const xt = [0, Math.round(s.planned/2), s.planned];
  const last = pts[pts.length-1];
  return `<div class="x-chart"><svg viewBox="0 0 ${W_} ${H}" role="img" aria-label="${esc(EV[x.w.metric].label)} per version by day">
    ${yt.map(v => `<line x1="${ml}" x2="${W_-mr}" y1="${Y(v).toFixed(1)}" y2="${Y(v).toFixed(1)}" style="stroke:var(--line-soft);stroke-width:1"/>
      <text x="${ml-8}" y="${(Y(v)+4).toFixed(1)}" text-anchor="end" style="fill:var(--dim-2);font:11px var(--mono)">${v}%</text>`).join("")}
    ${xt.map(d => `<text x="${X(d).toFixed(1)}" y="${H-8}" text-anchor="${d===0?"start":d===s.planned?"end":"middle"}" style="fill:var(--dim-2);font:11px var(--mono)">day ${d}</text>`).join("")}
    ${s.d < s.planned ? `<line x1="${X(s.d).toFixed(1)}" x2="${X(s.d).toFixed(1)}" y1="${mt}" y2="${mt+ih}" style="stroke:var(--dim-2);stroke-width:1;stroke-dasharray:3 4"/>
      <rect x="${X(s.d).toFixed(1)}" y="${mt}" width="${(X(s.planned)-X(s.d)).toFixed(1)}" height="${ih}" style="fill:rgb(255 255 255 / 2%)"/>
      <text x="${(X(s.d)+6).toFixed(1)}" y="${mt+12}" style="fill:var(--dim-2);font:11px var(--sans)">today</text>` : ""}
    <path d="${line(1)}" style="fill:none;stroke:#8d8069;stroke-width:2;stroke-linejoin:round"/>
    <path d="${line(2)}" style="fill:none;stroke:var(--blue);stroke-width:2.4;stroke-linejoin:round"/>
    <circle cx="${X(last[0]).toFixed(1)}" cy="${Y(last[1]).toFixed(1)}" r="3.5" style="fill:#8d8069;stroke:var(--card);stroke-width:2"/>
    <circle cx="${X(last[0]).toFixed(1)}" cy="${Y(last[2]).toFixed(1)}" r="4" style="fill:var(--blue);stroke:var(--card);stroke-width:2"/>
  </svg></div>`;
}
function planTab(x){
  const w = x.w, s = startDate(w), ws = weights(w);
  return `<p class="x-big-sentence" style="margin-bottom:18px">${planSentence(w)}</p>
    <div class="x-rev-grid" style="margin-top:0">
      <div class="review">
        <div><span class="k">Feature</span><span class="mono" style="font-size:12.5px">${featureKey(w)}</span></div>
        <div><span class="k">Who</span><span>${w.who.pct}% of ${esc(whoWords(w))}, per ${ENTITIES[w.entity].label.toLowerCase()}</span></div>
        <div><span class="k">Split</span><span>${w.variants.map((v,i) => `${esc(v.name)} ${ws[i]}%`).join(" · ")}</span></div>
        <div><span class="k">Decides it</span><span>${esc(EV[w.metric].label)}</span></div>
        <div><span class="k">Guardrails</span><span>${w.guards.map(g => esc(EV[g].label)).join(" · ") || "None"}</span></div>
        <div><span class="k">Runs</span><span>${dstr(s)} → ${dstr(addDays(s, w.weeks*7))}</span></div>
      </div>
      <div class="callout info"><span class="ico">◆</span><span>A running plan can't be edited, so the result always matches what people saw.
        <b>Change the plan</b> makes version 2 as a draft, pre-filled from this one.
        <button class="fix" style="color:var(--gold);font-weight:600;display:block;margin-top:8px" onclick="toast('Opens the builder at Review, pre-filled, as v2')">Change the plan →</button></span></div>
    </div>`;
}

/* ── the decision, handed to the recorder that already exists ── */
function openDecide(outcome){ const x = CREATED.find(c => c.key === APP.exp); APP.decide = {outcome, reason:DECISION_REASONS[outcome==="ship_treatment"?0:outcome==="keep_control"?1:3], flip:true}; APP.overlay = "decide"; renderOverlay(); }
function decideModal(){
  const x = CREATED.find(c => c.key === APP.exp), w = x.w, d = APP.decide, A = w.variants[0].name, B = w.variants[1].name, fk = featureKey(w);
  const target = d.outcome === "ship_treatment" ? B : A;
  return `<div class="modal narrow" role="dialog" aria-modal="true" aria-labelledby="dh" onclick="event.stopPropagation()" style="max-width:560px">
    <div class="modal-head"><div><h2 id="dh">Record the decision</h2><div class="sub">${x.key} · day ${APP.day}</div></div>
      <button class="x" onclick="closeOverlay()" aria-label="Close">✕</button></div>
    <div class="modal-body">
      <div class="field"><span class="lab">Outcome</span>
        <div class="picklist">${Object.entries(OUTCOME_WORDS).map(([k,l]) => `<button class="pick" aria-pressed="${d.outcome===k}" onclick="APP.decide.outcome='${k}';renderOverlay()"><span class="radio"></span><span class="t">${k==="ship_treatment"?`Ship ${esc(B)}`:k==="keep_control"?`Keep ${esc(A)}`:l}</span></button>`).join("")}</div></div>
      <div class="field"><span class="lab">Why</span>
        <div class="chips">${DECISION_REASONS.map(r => `<button class="chip" aria-pressed="${d.reason===r}" onclick="APP.decide.reason='${r.replace(/'/g,"\\'")}';renderOverlay()">${r}</button>`).join("")}</div></div>
      ${d.outcome === "ship_treatment" || d.outcome === "keep_control" ? `<div class="field"><span class="lab">And then</span>
        <button class="x-metric cb" aria-pressed="${d.flip}" onclick="APP.decide.flip=!APP.decide.flip;renderOverlay()"><span class="radio"></span>
          <span><span class="nm">Set ${esc(target)} for everyone in Production</span><span class="ev">${fk} → ${d.outcome==="ship_treatment"?"on":"off"} · 100%</span></span></button></div>` : ""}
    </div>
    <div class="modal-foot"><span class="note">The experiment stops and this version never runs again.</span>
      <button class="btn btn-ghost" onclick="closeOverlay()">Cancel</button>
      <button class="btn btn-primary" onclick="recordDecision()">${d.flip && (d.outcome==="ship_treatment"||d.outcome==="keep_control") ? `Record and roll out` : "Record decision"}</button></div>
  </div>`;
}
function recordDecision(){
  const x = CREATED.find(c => c.key === APP.exp); x.status = "decided"; x.outcome = APP.decide.outcome; x.reason = APP.decide.reason;
  const B = x.w.variants[1].name, A = x.w.variants[0].name;
  closeOverlay(); render();
  toast(APP.decide.flip && x.outcome === "ship_treatment" ? `Decision recorded. ${B} is on for everyone in Production.` : "Decision recorded", true);
}

/* ═══ chrome ═══ */
function render(){
  $("#content").innerHTML = APP.view === "detail" ? detailScreen() : listScreen();
  $("#exp-count").textContent = EXISTING.length + CREATED.length;
}
function renderOverlay(){
  const host = $("#overlays");
  if(!APP.overlay){ host.innerHTML = ""; document.body.style.overflow = ""; return; }
  const scroll = host.querySelector(".scrim")?.scrollTop || 0;
  const focusId = document.activeElement && document.activeElement.id;
  host.innerHTML = `<div class="scrim" onclick="closeOverlay()">${APP.overlay === "builder" ? builderModal() : decideModal()}</div>`;
  document.body.style.overflow = "hidden";
  const sc = host.querySelector(".scrim"); if(sc) sc.scrollTop = scroll;
  if(focusId){ const el = document.getElementById(focusId); if(el) el.focus({preventScroll:true}); }
}
function closeOverlay(){ APP.overlay = null; renderOverlay(); render(); }
function toggleNotes(){ APP.notes = !APP.notes; document.body.classList.toggle("notes", APP.notes); $("#notesbtn").setAttribute("aria-pressed", APP.notes); }
let toastTimer;
function toast(msg, undo){
  const host = $("#toasts");
  host.innerHTML = `<div class="toast"><span class="dot"></span><span>${esc(msg)}</span>${undo ? `<button onclick="undoDecision()">Undo</button>` : ""}</div>`;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => host.innerHTML = "", undo ? 10000 : 3200);
}
function undoDecision(){ const x = CREATED.find(c => c.key === APP.exp); if(x){ x.status = "running"; delete x.outcome; } $("#toasts").innerHTML = ""; render(); }
document.addEventListener("keydown", e => { if(e.key === "Escape" && APP.overlay) closeOverlay(); });

/* ═══ boot — opens on the builder, the thing this seed is about ═══
   #review · #results · #list deep-link to the other states. */
(function boot(){
  const h = (location.hash || "").slice(1);
  W = newDraft("copy");
  if(h === "results" || h === "decided"){
    const key = expKey(W); CREATED.unshift({key, w:clone({...W, saved:true}), status:"running"}); W.saved = true;
    APP.day = h === "decided" ? W.weeks*7 : 9; APP.view = "detail"; APP.exp = key;
  } else if(h !== "list"){
    W.step = h === "review" ? 6 : 1; APP.overlay = "builder";
  }
  render(); renderOverlay();
})();

</script>
